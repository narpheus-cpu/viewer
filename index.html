<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전자책 뷰어 - 모바일</title>
<script>
/* assets/android.js를 대체한다. 본문은 원본 IndexedDB에, 작은 위치는 localStorage에 저장한다. */
(function () {
  'use strict';
  const CHECKPOINT_KEY = 'ebookViewerBrowserCheckpointV1';
  function readCheckpoint() {
    try { return JSON.parse(localStorage.getItem(CHECKPOINT_KEY) || 'null'); }
    catch { return null; }
  }

  window.__browserCheckpoint = function (record) {
    if (restoreInProgress || readerState.initializing) return;
    try {
      const open = record ? !!record.isOpen : viewerOverlay.classList.contains('active');
      localStorage.setItem(CHECKPOINT_KEY, JSON.stringify({
        recentId: activeRecentId || '', isOpen: open, pageIndex,
        pageAnchor: pageAnchors.length ? readerAnchor() : 0,
        pageContext: readerState.context,
        layoutSignature: pages.length ? readerState.layout : '',
        updatedAt: Date.now()
      }));
    } catch (error) { console.error('Browser checkpoint:', error.message); }
  };

  window.__browserRecoverReading = async function (reading) {
    try {
      const saved = readCheckpoint();
      if (!saved || !(Number(saved.updatedAt) >= Number(reading?.updatedAt || 0))) return reading;
      if (!saved.isOpen) return reading ? { ...reading, isOpen: false } : reading;
      if (!saved.recentId) return reading;
      const book = await getRecentBook(saved.recentId);
      if (book && typeof book.text === 'string') return { ...saved, text: book.text };
    } catch (error) { console.error('Browser position recovery:', error.message); }
    return reading;
  };

  window.__browserRecentMeta = function (meta) {
    const saved = readCheckpoint();
    if (saved?.recentId === meta.id && Number(saved.updatedAt) >= Number(meta.updatedAt || 0)) {
      return { ...meta, pageIndex: saved.pageIndex, pageAnchor: saved.pageAnchor,
        pageContext: saved.pageContext || meta.pageContext,
        layoutSignature: saved.layoutSignature || meta.layoutSignature };
    }
    return meta;
  };

  window.__browserFlushState = async function () {
    if (restoreInProgress || readerState.initializing) return;
    flushReadingSessionSave(viewerOverlay.classList.contains('active'));
    clearTimeout(recentSaveTimer); recentSaveTimer = 0;
    await saveActiveRecentPosition();
    const reading = parseReadingRecord(loadReadingSessionSync());
    if (reading) await saveReadingSessionDB(reading);
    await readerState.pendingCache;
  };

  /* 원본의 네이티브 종료 훅을 브라우저 생명주기 이벤트로 치환한다.
     비동기 IndexedDB 저장보다 먼저 위 체크포인트가 동기 저장된다. */
  addEventListener('pagehide', () => { void window.__browserFlushState(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') void window.__browserFlushState();
  });

  /* Android 뒤로가기의 "열린 창 닫기"를 브라우저 뒤로가기/앞으로가기로 치환한다. */
  document.addEventListener('DOMContentLoaded', () => {
    readerReady.then(() => {
      const PANEL_KEY = 'ebookViewerBrowserPanelV1';
      let traversing = false;
      const currentPanel = () => viewerOverlay.classList.contains('active') ? 'viewer' :
        recentOverlay.classList.contains('active') ? 'recent' : '';
      const markPanel = panel => {
        try {
          const state = history.state && typeof history.state === 'object' ? history.state : {};
          const marked = state[PANEL_KEY] || '';
          if (panel && marked !== panel) {
            const next = { ...state, [PANEL_KEY]: panel };
            marked ? history.replaceState(next, '') : history.pushState(next, '');
          } else if (!panel && marked) history.back();
        } catch { /* Escape/닫기 버튼은 History API 제한 시에도 원본대로 동작한다. */ }
      };
      /* 이전 세션에서 사용자가 입력을 고쳐 복원을 취소한 경우 오래된 창 표식을 제거한다. */
      if (!currentPanel() && history.state?.[PANEL_KEY]) {
        const state = { ...history.state }; delete state[PANEL_KEY];
        try { history.replaceState(state, ''); } catch {}
      }
      markPanel(currentPanel());
      const observer = new MutationObserver(() => {
        if (!traversing) markPanel(currentPanel());
      });
      observer.observe(viewerOverlay, { attributes: true, attributeFilter: ['class'] });
      observer.observe(recentOverlay, { attributes: true, attributeFilter: ['class'] });
      addEventListener('popstate', () => {
        traversing = true;
        const target = history.state?.[PANEL_KEY] || '';
        if (viewerOverlay.classList.contains('active') && target !== 'viewer') closeViewer();
        if (recentOverlay.classList.contains('active') && target !== 'recent') hideRecentHistory();
        if (target === 'recent' && !recentOverlay.classList.contains('active')) showRecentHistory();
        if (target === 'viewer' && !viewerOverlay.classList.contains('active')) {
          void openViewer().catch(error => setStatus(error.message, true));
        }
        queueMicrotask(() => { traversing = false; });
      });
    });
  });
})();

</script>
<script>
/* Durable layout cache and a logical text anchor independent of changing page boundaries. */
const readerState={initializing:true,logicalAnchor:null,context:null,layout:'',canonical:'',canonicalSource:null,
  generation:0,fontId:'',fontPromise:Promise.resolve(),memory:new Map(),pendingCache:Promise.resolve(),cancelled:false};
const readerStats={splits:0,cacheHits:0,visibleRenders:0,measurements:0,lastPaginationMs:0};
let resolveReaderReady;
const readerReady=new Promise(resolve=>{resolveReaderReady=resolve;});
const READER_CACHE_VERSION=4;
const READER_CACHE_DB='ebookViewerLayoutCacheV1';

function readerCanonical(){
  if(readerState.canonicalSource!==fullText){
    getPaginationBlocks(fullText);
    readerState.canonical=cachedBlockTexts.join('\n');
    readerState.canonicalSource=fullText;
  }
  return readerState.canonical;
}
function readerContext(anchor){
  const text=readerCanonical(),offset=Math.min(text.length,Math.max(0,Number(anchor)||0));
  return {before:text.slice(Math.max(0,offset-32),offset),after:text.slice(offset,offset+96)};
}
function readerAnchor(){
  return readerState.logicalAnchor===null ? Number(pageAnchors[pageIndex])||0 : readerState.logicalAnchor;
}
function readerChooseAnchor(anchor,context){
  readerState.logicalAnchor=Math.max(0,Number(anchor)||0);
  readerState.context=context||readerContext(readerState.logicalAnchor);
}
function readerResolveAnchor(record){
  const text=readerCanonical();
  const original=Math.min(text.length,Math.max(0,Number(record?.pageAnchor)||0));
  const context=record?.pageContext;
  if(!context||typeof context.before!=='string'||typeof context.after!=='string')return original;
  const needle=context.before+context.after;
  if(!needle||text.slice(Math.max(0,original-context.before.length),original+context.after.length)===needle)return original;
  let best=original,distance=Infinity;
  for(let hit=text.indexOf(needle);hit>=0;hit=text.indexOf(needle,hit+1)){
    const target=hit+context.before.length,delta=Math.abs(target-original);
    if(delta<distance){best=target;distance=delta;}
  }
  return best;
}
function readerSetLoading(loading){
  viewerOverlay.classList.toggle('reader-loading',loading);
  viewerOverlay.setAttribute('aria-busy',String(loading));
}
function readerOversizedParagraph(html,text,box){
  if(text.length<=4096||!html.startsWith('<p>'))return false;
  // Shape only a DOM-preserving prefix. A paragraph whose prefix overflows cannot fit whole.
  const detached=document.createElement('div');detached.innerHTML=html;
  const paragraph=detached.firstElementChild;
  const walker=document.createTreeWalker(paragraph,NodeFilter.SHOW_TEXT);
  let node,left=4096;
  const range=document.createRange();range.selectNodeContents(paragraph);
  while((node=walker.nextNode())){
    if(node.length>=left){range.setEnd(node,left);break;}
    left-=node.length;
  }
  const prefix=paragraph.cloneNode(false);prefix.appendChild(range.cloneContents());
  box.replaceChildren(prefix);readerStats.measurements++;
  return box.scrollHeight>box.clientHeight+1;
}
function readerCacheDatabase(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(READER_CACHE_DB,1);
    request.onupgradeneeded=()=>request.result.createObjectStore('pages',{keyPath:'id'});
    request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
  });
}
async function readerReadCache(id){
  if(readerState.memory.has(id))return readerState.memory.get(id);
  try{
    const db=await readerCacheDatabase();
    try{return await new Promise((resolve,reject)=>{
      const request=db.transaction('pages').objectStore('pages').get(id);
      request.onsuccess=()=>{if(request.result)readerState.memory.set(id,request.result);resolve(request.result);};request.onerror=()=>reject(request.error);
    });}finally{db.close();}
  }catch{return null;}
}
async function readerStoreCache(record){
  readerState.memory.delete(record.id);readerState.memory.set(record.id,record);
  while(readerState.memory.size>RECENT_LIMIT)readerState.memory.delete(readerState.memory.keys().next().value);
  try{
    const db=await readerCacheDatabase();
    try{
      const tx=db.transaction('pages','readwrite'),store=tx.objectStore('pages');
      store.put(record);
      const all=store.getAll();
      all.onsuccess=()=>{
        for(const old of all.result.sort((a,b)=>b.updatedAt-a.updatedAt).slice(RECENT_LIMIT))store.delete(old.id);
      };
      await transactionDone(tx);
    }finally{db.close();}
  }catch{/* A disposable cache failure never deletes or changes book/font data. */}
}
async function readerDeleteCache(id){
  id ? readerState.memory.delete(id) : readerState.memory.clear();
  try{
    const db=await readerCacheDatabase();
    try{const tx=db.transaction('pages','readwrite');id?tx.objectStore('pages').delete(id):tx.objectStore('pages').clear();await transactionDone(tx);}finally{db.close();}
  }catch{}
}
function readerValidCache(cache,signature,source){
  return cache&&cache.version===READER_CACHE_VERSION&&cache.signature===signature&&cache.length===source.length&&
    typeof cache.canonical==='string'&&Array.isArray(cache.pages)&&cache.pages.length>0&&
    Array.isArray(cache.anchors)&&cache.anchors.length===cache.pages.length&&
    cache.anchors.every((x,i)=>Number.isFinite(x)&&x>=0&&(i===0||x>=cache.anchors[i-1]))&&
    cache.pages.every(x=>typeof x==='string');
}
async function readerHydrateReading(record){
  if(record?.textRef){
    const book=await getRecentBook(record.textRef).catch(()=>null);
    if(book)return {...record,text:book.text};
  }
  return record;
}
async function readerFingerprintFont(record){
  if(record.fingerprint)return record.fingerprint;
  if(crypto?.subtle){
    const digest=await crypto.subtle.digest('SHA-256',record.data);
    record.fingerprint=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');
  }else{
    const bytes=new Uint8Array(record.data);let hash=2166136261;
    for(const byte of bytes)hash=Math.imul(hash^byte,16777619)>>>0;
    record.fingerprint=bytes.length+':'+hash;
  }
  return record.fingerprint;
}
async function readerWaitForLayout(){
  await readerState.fontPromise;
  const family=getComputedStyle(pageInnerLeft).fontFamily;
  if(document.fonts){
    await document.fonts.load(viewerSettings.fontSize+'px '+family,'가나다라마바사 ABC abc 0123456789');
    await document.fonts.ready;
  }
  let previous='',stable=0;
  while(stable<3){
    await nextFrame();syncVisualViewport();
    const current=getLayoutSignature();
    stable=current===previous?stable+1:0;previous=current;
  }
}
async function readerDisplay(record={pageAnchor:0},generation=++readerState.generation){
  restoreInProgress=true;readerSetLoading(true);clearTimeout(repaginateTimer);
  const source=fullText,id=activeRecentId;
  const started=performance.now();
  try{
    let signature;
    while(generation===readerState.generation){
      await readerWaitForLayout();
      if(generation!==readerState.generation||!viewerOverlay.classList.contains('active'))return;
      signature=getLayoutSignature();
      const cached=id?await readerReadCache(id):null;
      if(generation!==readerState.generation)return;
      if(readerValidCache(cached,signature,source)){
        pages=cached.pages.slice();pageAnchors=cached.anchors.slice();
        readerState.canonical=cached.canonical;readerState.canonicalSource=source;readerStats.cacheHits++;
      }else{
        pages=splitIntoPages(source);
        readerCanonical();
      }
      // Insets/IME may finish adjusting during calculation. Reveal only the final layout.
      await nextFrame();await nextFrame();
      if(generation!==readerState.generation)return;
      if(signature!==getLayoutSignature())continue;
      break;
    }
    if(generation!==readerState.generation)return;
    readerState.layout=signature;
    const hasAnchor=record.pageAnchor!==null&&record.pageAnchor!==undefined&&Number.isFinite(Number(record.pageAnchor));
    const target=hasAnchor?readerResolveAnchor(record):Number(pageAnchors[Math.min(pages.length-1,Math.max(0,Number(record.pageIndex)||0))])||0;
    readerChooseAnchor(target,readerContext(target));
    pageIndex=findPageIndexForAnchor(target);
    restoreInProgress=false;
    render();readerSetLoading(false);
    readerStats.lastPaginationMs=performance.now()-started;
    flushReadingSessionSave(true);flushActiveRecentPositionSave();
    if(id){
      const cache={id,version:READER_CACHE_VERSION,signature,length:source.length,pages:pages.slice(),anchors:pageAnchors.slice(),
        canonical:readerCanonical(),updatedAt:Date.now()};
      // Do not serialize/rewrite the cache again when the current cache already matches.
    const current=readerState.memory.get(id);
      if(!readerValidCache(current,signature,source))readerState.pendingCache=readerStoreCache(cache);
    }
  }catch(error){
    if(generation===readerState.generation){restoreInProgress=false;readerSetLoading(false);setStatus(error.message||'전자책을 열지 못했습니다.',true);}
    throw error;
  }
}

/* Display-only breaks. Offsets always refer to the original visible text. */
function readerBreakKey(){
  return ['breakSentence','breakQuotes','breakAdverbs'].map(key=>viewerSettings[key]?1:0).join('');
}
function readerQuoteRoles(text){
  const roles=new Map(),stack=[];
  for(let i=0;i<text.length;i++){
    const quote=text[i];
    if(!/["“”＂]/.test(quote))continue;
    let slash=i-1;while(slash>=0&&text[slash]==='\\')slash--;
    if((i-1-slash)%2)continue;
    if(quote==='“'){roles.set(i,'open');stack.push('curly');continue;}
    if(quote==='”'){
      roles.set(i,'close');const match=stack.lastIndexOf('curly');if(match>=0)stack.splice(match,1);continue;
    }
    const match=stack.lastIndexOf(quote);
    if(match>=0){roles.set(i,'close');stack.splice(match,1);}
    else{roles.set(i,'open');stack.push(quote);}
  }
  return roles;
}
function readerBreakOffsets(text,settings=viewerSettings,quoteRoles=readerQuoteRoles(text),baseOffset=0){
  const breaks=new Set(),protectedDots=new Set();
  const add=offset=>{
    // A sentence-ending break belongs after its closing quote, never between text and quote.
    let next=offset;
    while(next<text.length&&/[ \t]/.test(text[next]))next++;
    while(quoteRoles.get(baseOffset+next)==='close'){
      offset=++next;
      while(next<text.length&&/[ \t]/.test(text[next]))next++;
    }
    if(offset<=0||offset>=text.length)return;
    // An existing newline or the start of the block already satisfies the rule.
    let left=offset-1,right=offset;
    while(left>=0&&/[ \t]/.test(text[left]))left--;
    while(right<text.length&&/[ \t]/.test(text[right]))right++;
    if(left<0||text[left]==='\n'||text[right]==='\n')return;
    breaks.add(offset);
  };
  if(settings.breakSentence){
    // Protect the whole abbreviation, including its final dot; protect decimals separately.
    const abbreviations=/(?:\b(?:[A-Za-z]\.){2,}|\b(?:Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|etc|e\.g|i\.e)\.)/g;
    for(const match of text.matchAll(abbreviations)){
      for(let i=0;i<match[0].length;i++)if(match[0][i]==='.')protectedDots.add(match.index+i);
    }
    for(let i=0;i<text.length;i++){
      if(!/[.?!]/.test(text[i]))continue;
      if(text[i]==='.'&&(protectedDots.has(i)||(/\d/.test(text[i-1]||'')&&/\d/.test(text[i+1]||''))))continue;
      // Keep an ellipsis or a ?! cluster together.
      if(/[.?!]/.test(text[i+1]||'')&&!protectedDots.has(i+1))continue;
      add(i+1);
    }
    // Korean sentence endings without punctuation. Do not split ordinary nouns ending in 다.
    const nouns=new Set(['바다','캐나다','소다','마다','저마다','판다','사이다']);
    const ending=/(?:[가-힣]{2,}다|간다|온다|본다|산다|잔다|된다|한다|같다|좋다|많다|없다|있다|싶다|크다|작다|쉽다|어렵다|맞다|옳다|싫다|[가-힣]+(?:요|죠|습니다|습니까|하자|해라|하라))$/u;
    for(const match of text.matchAll(/[가-힣]+(?=\s)/gu)){
      if(!nouns.has(match[0])&&ending.test(match[0]))add(match.index+match[0].length);
    }
  }
  if(settings.breakQuotes){
    for(let i=0;i<text.length;i++)if(quoteRoles.get(baseOffset+i)==='open')add(i);
  }
  if(settings.breakAdverbs){
    const words=/예를[ \t]+들어|이에[ \t]+따라|그리고|그러나|따라서|또한|즉|왜냐하면|그러므로|반면|한편|그렇다면/gu;
    for(const match of text.matchAll(words)){
      const before=text[match.index-1]||'',after=text[match.index+match[0].length]||'';
      if(!/[\p{L}\p{N}_]/u.test(before)&&!/[\p{L}\p{N}_]/u.test(after))add(match.index);
    }
  }
  const result=[];
  for(const offset of [...breaks].sort((a,b)=>a-b)){
    // Two selected rules around the same space represent one line break.
    if(result.length&&/^[ \t]*$/.test(text.slice(result[result.length-1],offset)))result[result.length-1]=offset;
    else result.push(offset);
  }
  return result;
}
function readerApplyBreaks(html,quoteRoles=null,baseOffset=0){
  if(readerBreakKey()==='000')return html;
  const root=document.createElement('div');root.innerHTML=html;
  const starts=new Map(),wholeWalker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
  let wholeNode,wholeText='';
  while((wholeNode=wholeWalker.nextNode())){
    starts.set(wholeNode,wholeText.length);
    if(wholeNode.nodeType===Node.TEXT_NODE)wholeText+=wholeNode.data;
    else if(wholeNode.tagName==='BR')wholeText+='\n';
  }
  const roles=quoteRoles||readerQuoteRoles(wholeText);
  // Each structural row is already a new line. Inline markup remains in place.
  const groups=root.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,th,td,blockquote,pre');
  for(const group of groups){
    const nodes=[],walker=document.createTreeWalker(group,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
    let node,text='';
    while((node=walker.nextNode())){
      if(node.nodeType===Node.TEXT_NODE){nodes.push({node,start:text.length});text+=node.data;}
      else if(node.tagName==='BR')text+='\n';
    }
    const offsets=readerBreakOffsets(text,viewerSettings,roles,baseOffset+(starts.get(group)||0));
    let last=offsets.length-1;
    for(let i=nodes.length-1;i>=0&&last>=0;i--){
      const entry=nodes[i],end=entry.start+entry.node.length;
      while(last>=0&&offsets[last]>=end)last--;
      while(last>=0&&offsets[last]>=entry.start){
        const offset=offsets[last--]-entry.start;
        const tail=entry.node.splitText(offset),br=document.createElement('br');
        br.setAttribute('data-reader-break','');tail.before(br);
      }
    }
  }
  return root.innerHTML;
}
function readerSafeQuoteCut(text,cut,quoteRoles,baseOffset=0){
  let next=cut;
  while(next<text.length&&/[ \t]/.test(text[next]))next++;
  if(quoteRoles.get(baseOffset+next)!=='close')return cut;
  // Keep at least the preceding character with the closing quote when a page is full.
  while(cut>1&&/[ \t]/.test(text[cut-1]))cut--;

function readerBlockSlicer(html){
  const root=document.createElement('div');root.innerHTML=html;
  const units=[],walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
  let node,length=0;
  while((node=walker.nextNode())){
    const size=node.nodeType===Node.TEXT_NODE?node.length:(node.tagName==='BR'&&!node.hasAttribute('data-reader-break')?1:0);
    if(size){units.push({node,start:length,end:length+size});length+=size;}

    let lo=0,hi=units.length-1;
    while(lo<hi){const mid=(lo+hi)>>1;if(units[mid].end<offset||(!end&&units[mid].end===offset))lo=mid+1;else hi=mid;}
    const entry=units[lo];
    if(entry.node.nodeType===Node.TEXT_NODE)return [entry.node,Math.min(entry.node.length,Math.max(0,offset-entry.start))];
    const parent=entry.node.parentNode,index=Array.prototype.indexOf.call(parent.childNodes,entry.node);

  }
  return (start,end)=>{
    if(!units.length)return html;
    const range=document.createRange();range.setStart(...point(start,false));range.setEnd(...point(end,true));
    let fragment=range.cloneContents(),ancestor=range.commonAncestorContainer;
    if(ancestor.nodeType===Node.TEXT_NODE)ancestor=ancestor.parentNode;
    while(ancestor!==root){const shell=ancestor.cloneNode(false);shell.appendChild(fragment);fragment=shell;ancestor=ancestor.parentNode;}
    const output=document.createElement('div');output.appendChild(fragment);return output.innerHTML;
  };
}
function readerSyncBreakButtons(){
  document.querySelectorAll('[data-break-option]').forEach(button=>button.setAttribute('aria-pressed',String(!!viewerSettings[button.dataset.breakOption])));
}

    --soft2:#2c2c2c;
    --line:#444;
  }
}
:root[data-theme="dark"]{
  --bg:#121212;
  --paper:#1c1c1c;
  --ink:#eee;
  --muted:#aaa;
  --soft:#262626;
  --soft2:#2c2c2c;
  --line:#444;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

/* ---------------- 입력 화면 ---------------- */
.app{
  width:min(640px,100%);
  min-height:100%;
  margin:0 auto;
  padding:32px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.panel{
  width:100%;
  background:var(--paper);
  border:1px solid var(--ink);
  border-radius:8px;
  padding:28px;
}
h1{
  margin:0 0 7px;
  font-size:24px;
  line-height:1.2;
  letter-spacing:-.03em;
}
.sub{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  margin-bottom:20px;
}
label{
  display:block;
  margin:0 0 7px;
  font-size:13px;
  font-weight:800;
}
textarea{
  width:100%;
  min-height:320px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  padding:11px 12px;
  outline:none;
  resize:vertical;
  line-height:1.55;
}
textarea:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
button{
  border:1px solid var(--ink);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  padding:9px 12px;
  font-weight:800;
}
button:hover:not(:disabled){background:var(--soft)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{
  width:100%;
  margin-top:12px;
  background:var(--ink);
  color:var(--paper);
  padding:11px 14px;
}
.primary:hover:not(:disabled){opacity:.85}
.secondary{background:var(--paper);color:var(--ink)}
.status{
  min-height:18px;
  margin-top:9px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}
.status.error{color:var(--ink);font-weight:800}

/* ---------------- 전자책 팝업 ---------------- */
.modal-overlay{
  display:none;
  position:fixed;
  top:var(--visual-viewport-top,0px);
  left:var(--visual-viewport-left,0px);
  width:var(--visual-viewport-width,100vw);
  height:var(--visual-viewport-height,100svh);
  z-index:1000;
  align-items:stretch;
  justify-content:stretch;
  padding:0;
  background:rgba(0,0,0,.55);
}
.modal-overlay.active{display:flex}
.book{
  width:100%;
  min-width:0;
  height:100%;
  min-height:0;
  background:var(--paper);
  border:0;
  border-radius:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  --viewer-font-size:18px;
  --viewer-line-height:1.75;
  --viewer-pad-top:42px;
  --viewer-pad-right:64px;
  --viewer-pad-bottom:42px;
  --viewer-pad-left:64px;
}
.bookhead{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--ink);
}
.booktitle{font-weight:900}
.book-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.book-actions button{padding:7px 10px;font-size:12px}
.book-actions button .button-note{display:block;margin-top:2px;font-size:10px;font-weight:600;line-height:1.25;color:var(--muted)}
.viewer-settings{
  display:none;
  flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:var(--paper);
  padding:12px 14px;
}
.viewer-settings.open{display:block}
.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px 18px;
}
.setting-row{
  display:grid;
  grid-template-columns:108px minmax(90px,1fr) 72px;
  gap:8px;
  align-items:center;
}
.setting-label{margin:0;font-size:12px;font-weight:800}
.setting-row input[type="range"]{padding:0;border:0;box-shadow:none;accent-color:var(--ink)}
.setting-row input[type="number"]{
  padding:6px 7px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  text-align:right;
  font-size:12px;
}
.setting-font{
  display:grid;
  grid-template-columns:108px 1fr;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}
.setting-font select{
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  font-size:12px;
}
.font-upload{
  display:grid;
  grid-template-columns:108px minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
  margin:0 0 10px;
}
.font-upload input[type="file"]{
  min-width:0;
  width:100%;
  padding:6px 7px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  font-size:12px;
}
.font-upload button{padding:7px 10px;font-size:12px}
.font-upload-status{
  grid-column:2 / -1;
  min-height:16px;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}
.settings-footer{display:flex;justify-content:flex-end;margin-top:10px}
.settings-footer button{padding:7px 10px;font-size:12px}
.page-spread{
  flex:1 1 auto;
  min-height:0;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  overflow:hidden;
  background:var(--paper);
}
.page{
  min-width:0;
  min-height:0;
  overflow:hidden;
  position:relative;
  padding:var(--viewer-pad-top) var(--viewer-pad-right) var(--viewer-pad-bottom) var(--viewer-pad-left);
  background:var(--paper);
}
.page + .page{border-left:1px solid var(--line)}
.page-inner{
  height:100%;
  overflow:hidden;
  color:var(--ink);
  font-family:Georgia,"Times New Roman","Noto Serif KR",serif;
  font-size:var(--viewer-font-size);
  line-height:var(--viewer-line-height);
  word-break:break-word;
  overflow-wrap:anywhere;
}
.pagination-measure{
  position:fixed!important;
  left:-200vw!important;
  top:0!important;
  visibility:hidden!important;
  pointer-events:none!important;
  overflow:hidden!important;
  margin:0!important;
  padding:0!important;
  z-index:-1!important;
}
.page-inner h1,.page-inner h2,.page-inner h3,.page-inner h4{display:block!important;width:100%;margin:.2em 0 .7em;line-height:1.3;font-family:inherit;clear:both}
.page-inner h1{font-size:1.65em}
.page-inner h2{font-size:1.4em}
.page-inner h3{font-size:1.18em}
.page-inner p{margin:0 0 1em}
.page-inner ul,.page-inner ol{margin:.2em 0 1em;padding-left:1.6em}
.page-inner li{margin:.25em 0}
.page-inner blockquote{margin:.5em 0 1em;padding:.1em 0 .1em 1em;border-left:4px solid var(--ink);color:var(--muted)}
.page-inner pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:var(--soft);
  border:1px solid var(--line);
  padding:12px 14px;
  border-radius:4px;
  font-family:Consolas,"Courier New",monospace;
  font-size:.82em;
  line-height:1.55;
}
.page-inner code{background:var(--soft2);padding:.12em .3em;border-radius:2px;font-family:Consolas,"Courier New",monospace;font-size:.88em}
.page-inner pre code{background:none;padding:0}
.page-inner a{color:var(--ink);text-decoration:underline}
.page-inner hr{border:0;border-top:1px solid var(--ink);margin:1.2em 0}
.page-inner table{width:100%;border-collapse:collapse;margin:.4em 0 1em;font-family:Arial,"Noto Sans KR",sans-serif;font-size:.82em}
.page-inner th,.page-inner td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;font-family:Arial,"Noto Sans KR",sans-serif}
.controls{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  padding:10px 14px;
  border-top:1px solid var(--ink);
  background:var(--paper);
}
.controls button{min-width:92px;padding:7px 10px;font-size:12px}
.counter{min-width:85px;text-align:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}

@media(max-width:800px){
  .panel{padding:18px}
  .page{--viewer-pad-right:24px;--viewer-pad-left:24px}
}
@media(max-width:560px){
  .setting-row{grid-template-columns:92px minmax(70px,1fr) 66px}
  .setting-font{grid-template-columns:92px 1fr}
  .font-upload{grid-template-columns:92px minmax(0,1fr)}
  .font-upload button{grid-column:2;justify-self:start}
  .book-actions{justify-content:flex-end}
  .page{--viewer-pad-right:16px;--viewer-pad-left:16px}
  .page-inner{font-size:calc(var(--viewer-font-size) * .88)}
}

function setStatus(msg,err=false){

  statusEl.classList.toggle('error',!!err);
}

function parseReadingRecord(raw){
  if(!raw)return null;
  try{
    const parsed=typeof raw==='string'?JSON.parse(raw):raw;
    if(!parsed||typeof parsed!=='object'||typeof parsed.text!=='string')return null;
    return {
      text:parsed.text,
      textRef:typeof parsed.textRef==='string'?parsed.textRef:'',
      pageContext:parsed.pageContext||null,
      pageIndex:Number.isFinite(Number(parsed.pageIndex))?Number(parsed.pageIndex):0,
      pageAnchor:parsed.pageAnchor!==null&&parsed.pageAnchor!==undefined&&Number.isFinite(Number(parsed.pageAnchor))?Number(parsed.pageAnchor):null,
      layoutSignature:typeof parsed.layoutSignature==='string'?parsed.layoutSignature:'',
      recentId:typeof parsed.recentId==='string'?parsed.recentId:'',
      isOpen:!!parsed.isOpen,
      updatedAt:Number.isFinite(Number(parsed.updatedAt))?Number(parsed.updatedAt):0
    };
  }catch(e){
    return null;
  }
}

function newestReadingRecord(records){
  const valid=records.filter(Boolean);
  if(!valid.length)return null;
  return valid.reduce((best,item)=>item.updatedAt>=best.updatedAt?item:best);
}

function loadReadingSessionSync(){
  const records=[];
  try{ records.push(parseReadingRecord(localStorage.getItem(READING_STORAGE))); }catch(e){}
  try{ records.push(parseReadingRecord(sessionStorage.getItem(READING_STORAGE))); }catch(e){}
  try{ records.push(parseReadingRecord(history.state?.ebookViewerReadingMobileV1)); }catch(e){}
  try{
    if(typeof window.name==='string'&&window.name.startsWith(READING_WINDOW_PREFIX)){
      records.push(parseReadingRecord(window.name.slice(READING_WINDOW_PREFIX.length)));
    }
  }catch(e){}
  return newestReadingRecord(records);
}

function openReadingDatabase(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    const request=indexedDB.open(READING_DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(READING_DB_STORE)){
        request.result.createObjectStore(READING_DB_STORE);
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('Reading DB open failed'));
  });
}

async function loadReadingSessionDB(){
  try{
    const db=await openReadingDatabase();
    return await new Promise(resolve=>{
      const request=db.transaction(READING_DB_STORE,'readonly').objectStore(READING_DB_STORE).get('current');
      request.onsuccess=()=>{ const value=parseReadingRecord(request.result); db.close(); resolve(value); };
      request.onerror=()=>{ db.close(); resolve(null); };
    });
  }catch(e){
    return null;
  }
}

let readingDatabaseWrite=Promise.resolve();
function saveReadingSessionDB(record){
  const snapshot={...record};
  readingDatabaseWrite=readingDatabaseWrite.catch(()=>{}).then(async()=>{
    const db=await openReadingDatabase();
    try{const tx=db.transaction(READING_DB_STORE,'readwrite');tx.objectStore(READING_DB_STORE).put(snapshot,'current');await transactionDone(tx);}
    finally{db.close();}
  }).catch(()=>{});
  return readingDatabaseWrite;
}

function openRecentDatabase(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('최근 내역 저장소를 사용할 수 없습니다.'));
      return;
    }
    const request=indexedDB.open(RECENT_DB_NAME,RECENT_DB_VERSION);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains(RECENT_TEXT_STORE))db.createObjectStore(RECENT_TEXT_STORE,{keyPath:'id'});
      if(!db.objectStoreNames.contains(RECENT_META_STORE))db.createObjectStore(RECENT_META_STORE,{keyPath:'id'});
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('최근 내역 저장소를 열 수 없습니다.'));
  });
}

function transactionDone(tx){
  return new Promise((resolve,reject)=>{
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('저장 중 오류가 발생했습니다.'));
    tx.onabort=()=>reject(tx.error||new Error('저장이 취소되었습니다.'));
  });
}

async function digestTextId(text){
  const value=String(text||'');
  try{
    if(globalThis.crypto?.subtle&&globalThis.TextEncoder){
      const bytes=new TextEncoder().encode(value);
      const hash=await crypto.subtle.digest('SHA-256',bytes);
      return 'sha256-'+Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  /* file:// 등 WebCrypto가 제한된 환경용 안정적인 fallback */
  let h1=0x811c9dc5,h2=0x9e3779b9;
  for(let i=0;i<value.length;i++){
    const c=value.charCodeAt(i);
    h1=Math.imul(h1^c,0x01000193)>>>0;
    h2=Math.imul(h2^(c+i),0x85ebca6b)>>>0;
  }
  return `fnv-${value.length}-${h1.toString(16)}-${h2.toString(16)}`;
}

function makeRecentTitle(text){
  const cleaned=String(text||'')
    .replace(/```[\s\S]*?```/g,' ')
    .replace(/[#>*_~`\[\]()|]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
  const title=(cleaned||'제목 없는 텍스트').slice(0,44);
  return cleaned.length>44?title+'…':title;
}

function formatRecentTime(ts){
  const d=new Date(Number(ts)||Date.now());
  try{
    return new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
  }catch(e){return d.toLocaleString();}
}

function formatTextLength(n){
  n=Math.max(0,Number(n)||0);
  if(n>=10000)return `${(n/10000).toFixed(n>=100000?0:1)}만 자`;
  return `${n.toLocaleString()}자`;
}

async function getRecentMetas(){
  const db=await openRecentDatabase();
  try{
    const tx=db.transaction(RECENT_META_STORE,'readonly');
    const request=tx.objectStore(RECENT_META_STORE).getAll();
    const rows=await new Promise((resolve,reject)=>{
      request.onsuccess=()=>resolve(request.result||[]);
      request.onerror=()=>reject(request.error||new Error('최근 내역을 읽을 수 없습니다.'));
    });
    return rows.sort((a,b)=>(Number(b.updatedAt)||0)-(Number(a.updatedAt)||0));
  }finally{db.close();}
}

async function getRecentMeta(id){
  const db=await openRecentDatabase();
  try{
    const tx=db.transaction(RECENT_META_STORE,'readonly');
    const request=tx.objectStore(RECENT_META_STORE).get(id);
    return await new Promise((resolve,reject)=>{
      request.onsuccess=()=>resolve(request.result||null);
      request.onerror=()=>reject(request.error||new Error('최근 내역 정보를 읽을 수 없습니다.'));
    });
  }finally{db.close();}
}

async function getRecentBook(id){
  const db=await openRecentDatabase();
  try{
    const tx=db.transaction([RECENT_TEXT_STORE,RECENT_META_STORE],'readonly');
    const textReq=tx.objectStore(RECENT_TEXT_STORE).get(id);
    const metaReq=tx.objectStore(RECENT_META_STORE).get(id);
    const [textRec,meta]=await Promise.all([
      new Promise((resolve,reject)=>{textReq.onsuccess=()=>resolve(textReq.result||null);textReq.onerror=()=>reject(textReq.error);}),
      new Promise((resolve,reject)=>{metaReq.onsuccess=()=>resolve(metaReq.result||null);metaReq.onerror=()=>reject(metaReq.error);})
    ]);
    if(!textRec||typeof textRec.text!=='string')return null;
    return {text:textRec.text,meta:meta||{id}};
  }finally{db.close();}
}

async function putRecentTextAndMeta(text,meta){
  const db=await openRecentDatabase();
  try{
    const tx=db.transaction([RECENT_TEXT_STORE,RECENT_META_STORE],'readwrite');
    tx.objectStore(RECENT_TEXT_STORE).put({id:meta.id,text,createdAt:meta.createdAt||Date.now()});
    tx.objectStore(RECENT_META_STORE).put(meta);
    await transactionDone(tx);
  }finally{db.close();}
}

async function putRecentMeta(meta){
  if(!meta?.id)return;
  const db=await openRecentDatabase();
  try{
    const tx=db.transaction(RECENT_META_STORE,'readwrite');
    tx.objectStore(RECENT_META_STORE).put(meta);
    await transactionDone(tx);
  }finally{db.close();}
}

async function deleteRecentById(id){
  const db=await openRecentDatabase();
  try{
    const tx=db.transaction([RECENT_TEXT_STORE,RECENT_META_STORE],'readwrite');
    tx.objectStore(RECENT_TEXT_STORE).delete(id);
    tx.objectStore(RECENT_META_STORE).delete(id);
    await transactionDone(tx);
  }finally{db.close();}
  void readerDeleteCache(id);
  if(activeRecentId===id){activeRecentId='';activeRecentMeta=null;}
}

async function clearRecentHistory(){
  const db=await openRecentDatabase();
  try{
    const tx=db.transaction([RECENT_TEXT_STORE,RECENT_META_STORE],'readwrite');
    tx.objectStore(RECENT_TEXT_STORE).clear();
    tx.objectStore(RECENT_META_STORE).clear();
    await transactionDone(tx);
  }finally{db.close();}
  activeRecentId='';
  activeRecentMeta=null;
  void readerDeleteCache();
}

async function pruneRecentHistory(){
  const metas=await getRecentMetas();
  if(metas.length<=RECENT_LIMIT)return;
  for(const meta of metas.slice(RECENT_LIMIT))await deleteRecentById(meta.id);
}

async function upsertRecentText(text,{resetPosition=true}={}){
  const id=await digestTextId(text);
  let existing=null;
  try{existing=await getRecentMeta(id);}catch(e){}
  const now=Date.now();
  if(!resetPosition&&existing)existing=window.__browserRecentMeta(existing);
  const live=!resetPosition&&id===activeRecentId&&text===fullText&&pages.length?currentRecentPositionMeta():null;
  if(live)existing=live;
  const meta={
    id,
    title:makeRecentTitle(text),
    length:String(text).length,
    createdAt:Number(existing?.createdAt)||now,
    updatedAt:now,
    pageIndex:resetPosition?0:(Number(existing?.pageIndex)||0),
    pageAnchor:resetPosition?0:(Number(existing?.pageAnchor)||0),
    pageContext:resetPosition?null:(existing?.pageContext||null),
    layoutSignature:resetPosition?'':(typeof existing?.layoutSignature==='string'?existing.layoutSignature:'')
  };
  await putRecentTextAndMeta(text,meta);
  activeRecentId=id;
  activeRecentMeta=meta;
  await pruneRecentHistory();
  return meta;
}

function currentRecentPositionMeta(){
  if(!activeRecentId||!activeRecentMeta)return null;
  const safeIndex=Math.min(Math.max(0,pageIndex),Math.max(0,pageAnchors.length-1));
  const anchor=pageAnchors.length?readerAnchor():0;
  return {
    ...activeRecentMeta,
    id:activeRecentId,
    pageIndex,
    pageAnchor:anchor,
    pageContext:readerState.context,
    layoutSignature:pages.length?readerState.layout:(activeRecentMeta.layoutSignature||''),
    updatedAt:Date.now()
  };
}

async function saveActiveRecentPosition(){
  if(restoreInProgress)return;
  const meta=currentRecentPositionMeta();
  if(!meta)return;
  activeRecentMeta=meta;
  try{await putRecentMeta(meta);}catch(e){}
}

function scheduleActiveRecentPositionSave(delay=180){
  if(!activeRecentId||restoreInProgress)return;
  clearTimeout(recentSaveTimer);
  recentSaveTimer=setTimeout(()=>{
    recentSaveTimer=0;
    void saveActiveRecentPosition();
  },delay);
}

function flushActiveRecentPositionSave(){
  clearTimeout(recentSaveTimer);
  recentSaveTimer=0;
  void saveActiveRecentPosition();
}

async function activateRecentFromReading(reading){
  const id=typeof reading?.recentId==='string'?reading.recentId:'';
  if(!id)return;
  try{
    const book=await getRecentBook(id);
    if(book?.meta){activeRecentId=id;activeRecentMeta=book.meta;}
  }catch(e){}
}

async function renderRecentHistory(){
  recentList.innerHTML='<div class="recent-empty">불러오는 중...</div>';
  try{
    const metas=(await getRecentMetas()).slice(0,RECENT_LIMIT);
    if(!metas.length){
      recentList.innerHTML='<div class="recent-empty">저장된 내역이 없습니다.</div>';
      return;
    }
    recentList.innerHTML='';
    for(const meta of metas){
      const row=document.createElement('div');
      row.className='recent-item';
      row.dataset.id=meta.id;
      const main=document.createElement('div');
      main.className='recent-main';
      main.tabIndex=0;
      const title=document.createElement('div');
      title.className='recent-title';
      title.textContent=meta.title||'제목 없는 텍스트';
      const sub=document.createElement('div');
      sub.className='recent-meta';
      sub.textContent=`${formatRecentTime(meta.updatedAt)} · ${formatTextLength(meta.length)} · ${Math.max(1,(Number(meta.pageIndex)||0)+1)}쪽에서 읽음`;
      main.append(title,sub);
      const actions=document.createElement('div');
      actions.className='recent-actions';
      const open=document.createElement('button');
      open.type='button';open.className='secondary';open.textContent='열기';
      const del=document.createElement('button');
      del.type='button';del.className='secondary';del.textContent='삭제';
      open.addEventListener('click',()=>void openRecentBook(meta.id));
      main.addEventListener('click',()=>void openRecentBook(meta.id));
      main.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();void openRecentBook(meta.id);}});
      del.addEventListener('click',async e=>{
        e.stopPropagation();
        await deleteRecentById(meta.id);
        await renderRecentHistory();
      });
      actions.append(open,del);
      row.append(main,actions);
      recentList.appendChild(row);
    }
  }catch(error){
    recentList.innerHTML='<div class="recent-empty">최근 내역을 불러오지 못했습니다.</div>';
    setStatus(error.message||'최근 내역을 불러오지 못했습니다.',true);
  }
}

  recentOverlay.classList.add('active');

function hideRecentHistory(){

function getLayoutSignature(){
  const rect=pageInnerLeft.getBoundingClientRect(),style=getComputedStyle(pageInnerLeft);
  return JSON.stringify(['layout-v4',readerBreakKey(),rect.width,rect.height,devicePixelRatio,
    viewerSettings.font,viewerSettings.font==='custom'?readerState.fontId:'system',
    style.fontFamily,style.fontSize,style.lineHeight,style.letterSpacing,style.wordBreak,style.overflowWrap,
    viewerSettings.padTop,viewerSettings.padBottom,viewerSettings.padLeft,viewerSettings.padRight,
    navigator.userAgent]);
}
let readingSaveTimer=0;
let scheduledReadingOpenState=false;

function scheduleReadingSessionSave(isOpen=viewerOverlay.classList.contains('active'),delay=120){
  if(restoreInProgress)return;
  scheduledReadingOpenState=!!isOpen;
  clearTimeout(readingSaveTimer);
  readingSaveTimer=setTimeout(()=>{
    readingSaveTimer=0;
    saveReadingSession(scheduledReadingOpenState);
  },delay);
}

function flushReadingSessionSave(isOpen=viewerOverlay.classList.contains('active')){
  clearTimeout(readingSaveTimer);
  readingSaveTimer=0;
  return saveReadingSession(isOpen);
}

function saveReadingSession(isOpen=viewerOverlay.classList.contains('active')){
  if(restoreInProgress||readerState.initializing)return false;
  const text=isOpen&&fullText!==''?fullText:inputText.value;
  const safeIndex=Math.min(Math.max(0,pageIndex),Math.max(0,pageAnchors.length-1));
  const pageAnchor=pageAnchors.length?readerAnchor():0;
  const record={
    text:activeRecentId&&text===fullText?'':text,
    textRef:activeRecentId&&text===fullText?activeRecentId:'',
    pageIndex,
    pageAnchor,
    pageContext:readerState.context,
    layoutSignature:pages.length?readerState.layout:'',
    recentId:activeRecentId||'',
    isOpen,
    updatedAt:Date.now()
  };
  window.__browserCheckpoint?.(record);
  const raw=JSON.stringify(record);
  let savedSomewhere=false;
  try{ localStorage.setItem(READING_STORAGE,raw); savedSomewhere=true; }catch(e){}
  try{ sessionStorage.setItem(READING_STORAGE,raw); savedSomewhere=true; }catch(e){}
  try{
    const state=(history.state&&typeof history.state==='object')?history.state:{};
    history.replaceState({...state,ebookViewerReadingMobileV1:raw},'');
    savedSomewhere=true;
  }catch(e){}
  try{ window.name=READING_WINDOW_PREFIX+raw; savedSomewhere=true; }catch(e){}
  void saveReadingSessionDB(record);
  restoredSessionUpdatedAt=Math.max(restoredSessionUpdatedAt,record.updatedAt);
  return savedSomewhere;
}

inputText.addEventListener('input',()=>{
  userEditedAfterRestore=true;
  scheduleReadingSessionSave(false,180);
});

function loadViewerSettings(){
  /* Android SharedPreferences 설정 읽기는 아래 원본 localStorage 읽기로 대체. */
  try{
    const raw=localStorage.getItem(VIEWER_STORAGE);
    if(raw){
      const parsed=JSON.parse(raw);
      return {...viewerDefaults,...parsed};
    }
  }catch(e){}
  return {...viewerDefaults};
}

function saveViewerSettings(){
  /* Android SharedPreferences 설정 쓰기는 아래 원본 localStorage 쓰기로 대체. */
  try{ localStorage.setItem(VIEWER_STORAGE,JSON.stringify(viewerSettings)); }catch(e){}
}

const FONT_DB_NAME='ebookViewerFontDBV1';
const FONT_STORE_NAME='fonts';

function setFontUploadStatus(msg,error=false){
  fontUploadStatus.textContent=msg;
  fontUploadStatus.style.color=error?'var(--ink)':'var(--muted)';
}

function openFontDatabase(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('이 브라우저에서는 글꼴 저장을 지원하지 않습니다.'));
      return;
    }
    const request=indexedDB.open(FONT_DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(FONT_STORE_NAME)){
        request.result.createObjectStore(FONT_STORE_NAME);
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('글꼴 저장소를 열 수 없습니다.'));
  });
}

async function getSavedFont(){
  const db=await openFontDatabase();
  return new Promise((resolve,reject)=>{
    const request=db.transaction(FONT_STORE_NAME,'readonly')
      .objectStore(FONT_STORE_NAME).get('current');
    request.onsuccess=()=>{
      db.close();
      resolve(request.result||null);
    };
    request.onerror=()=>{
      db.close();
      reject(request.error||new Error('저장된 글꼴을 읽을 수 없습니다.'));
    };
  });
}

async function saveFontRecord(record){
  const db=await openFontDatabase();
  return new Promise((resolve,reject)=>{
    const request=db.transaction(FONT_STORE_NAME,'readwrite')
      .objectStore(FONT_STORE_NAME).put(record,'current');
    request.onsuccess=()=>{
      db.close();
      resolve();
    };
    request.onerror=()=>{
      db.close();
      reject(request.error||new Error('글꼴을 저장할 수 없습니다.'));
    };
  });
}

async function deleteSavedFont(){
  const db=await openFontDatabase();
  return new Promise((resolve,reject)=>{
    const request=db.transaction(FONT_STORE_NAME,'readwrite')
      .objectStore(FONT_STORE_NAME).delete('current');
    request.onsuccess=()=>{
      db.close();
      resolve();
    };
    request.onerror=()=>{
      db.close();
      reject(request.error||new Error('저장된 글꼴을 삭제할 수 없습니다.'));
    };
  });
}

async function installCustomFont(record,{select=false,repaginateAfter=false}={}){
  if(!record)return false;
  const fingerprint=await readerFingerprintFont(record);
  if(customFontReady&&readerState.fontId===fingerprint){
    customFontOption.disabled=false;
    customFontOption.textContent=`${record.name} (업로드)`;
    if(select){viewerSettings.font='custom';applyViewerSettings(repaginateAfter);}
    return true;
  }
  const load=(async()=>{
    let face=null;
    if('FontFace' in window&&document.fonts){
      // FontFace copies its input internally; avoid another copy of a large CJK font.
      face=new FontFace('UploadedViewerFont',record.data);
      await face.load();
    }
    if(customFontFace&&document.fonts?.delete)document.fonts.delete(customFontFace);
    if(customFontUrl)URL.revokeObjectURL(customFontUrl);
    if(customFontStyle)customFontStyle.remove();
    customFontUrl='';customFontStyle=null;
    if(face){document.fonts.add(face);customFontFace=face;}
    else{
      customFontUrl=URL.createObjectURL(new Blob([record.data],{type:record.mime||'application/octet-stream'}));
      customFontStyle=document.createElement('style');
      customFontStyle.textContent=`@font-face{font-family:"UploadedViewerFont";src:url("${customFontUrl}");font-display:block;}`;
      document.head.appendChild(customFontStyle);
      if(document.fonts?.load)await document.fonts.load('18px "UploadedViewerFont"');
    }
    readerState.fontId=fingerprint;customFontReady=true;
    customFontOption.disabled=false;customFontOption.textContent=`${record.name} (업로드)`;
    if(select)viewerSettings.font='custom';
    applyViewerSettings(repaginateAfter);
    return true;
  })();
  readerState.fontPromise=load.catch(()=>{});
  return load;
}

async function applyCustomFont(record){
  return installCustomFont(record,{select:true,repaginateAfter:true});
}

function clampValue(key,value){
  const rules={
    fontSize:[12,36],
    lineHeight:[1.1,2.6],
    padTop:[0,160],
    padBottom:[0,160],
    padLeft:[0,180],
    padRight:[0,180]
  };
  const [min,max]=rules[key];
  const n=Number(value);
  return Math.min(max,Math.max(min,Number.isFinite(n)?n:viewerDefaults[key]));
}

function applyViewerSettingsVisuals(syncControls=true){
  readerSyncBreakButtons();
  viewerSettings.fontSize=clampValue('fontSize',viewerSettings.fontSize);
  viewerSettings.lineHeight=clampValue('lineHeight',viewerSettings.lineHeight);
  viewerSettings.padTop=clampValue('padTop',viewerSettings.padTop);
  viewerSettings.padBottom=clampValue('padBottom',viewerSettings.padBottom);
  viewerSettings.padLeft=clampValue('padLeft',viewerSettings.padLeft);
  viewerSettings.padRight=clampValue('padRight',viewerSettings.padRight);

  book.style.setProperty('--viewer-font-size',viewerSettings.fontSize+'px');
  book.style.setProperty('--viewer-line-height',viewerSettings.lineHeight);
  book.style.setProperty('--viewer-pad-top',viewerSettings.padTop+'px');
  book.style.setProperty('--viewer-pad-bottom',viewerSettings.padBottom+'px');
  book.style.setProperty('--viewer-pad-left',viewerSettings.padLeft+'px');
  book.style.setProperty('--viewer-pad-right',viewerSettings.padRight+'px');

  const fontMap={
    serif:'Georgia, "Times New Roman", "Noto Serif KR", serif',
    sans:'Arial, "Noto Sans KR", "Malgun Gothic", sans-serif',
    mono:'Consolas, "Courier New", monospace',
    custom:'"UploadedViewerFont", serif'
  };
  const effectiveFont=(viewerSettings.font==='custom'&&!customFontReady)?'serif':viewerSettings.font;
  const selectedFont=fontMap[effectiveFont]||fontMap.serif;
  pageInnerLeft.style.fontFamily=selectedFont;
  pageInnerRight.style.fontFamily=selectedFont;

  if(syncControls){
    $('#viewerFont').value=viewerSettings.font;
    Object.entries(viewerControls).forEach(([key,[rangeSel,numSel]])=>{
      $(rangeSel).value=viewerSettings[key];

    });

}

let liveSettingFrame=0;
let repaginateTimer;
let repaginateDeferredBySettings=false;

function settingsPanelIsOpen(){
  return $('#viewerSettings').classList.contains('open');
}

/*
  긴 책에서 가장 비싼 작업은 splitIntoPages() 전체 재실행이다.
  설정 패널이 열려 있는 동안에는 CSS 값만 즉시 바꾸고,
  실제 페이지 재분할은 설정 패널을 닫을 때 한 번만 수행한다.
*/
function scheduleRepaginate(delay=90){
  if(!viewerOverlay.classList.contains('active'))return;
  if(restoreInProgress){
    clearTimeout(repaginateTimer);
    return;
  }
  if(settingsPanelIsOpen()){
    repaginateDeferredBySettings=true;
    clearTimeout(repaginateTimer);
    return;
  }
  repaginateDeferredBySettings=false;
  clearTimeout(repaginateTimer);
  repaginateTimer=setTimeout(repaginate,delay);
}

function flushLiveViewerSettings(){
  if(liveSettingFrame){
    cancelAnimationFrame(liveSettingFrame);
    liveSettingFrame=0;
  }
  applyViewerSettingsVisuals(false);
}

function queueLiveViewerSettings(){
  if(liveSettingFrame)return;
  liveSettingFrame=requestAnimationFrame(()=>{
    liveSettingFrame=0;
    applyViewerSettingsVisuals(false);
  });
}

function commitViewerSettings(){
  flushLiveViewerSettings();
  saveViewerSettings();
  scheduleRepaginate();
}

function applyViewerSettings(repaginateAfter=true){
  flushLiveViewerSettings();
  applyViewerSettingsVisuals(true);
  saveViewerSettings();
  if(repaginateAfter)scheduleRepaginate();
}

function bindViewerPair(key,rangeSel,numSel){
  const range=$(rangeSel),num=$(numSel);

  const live=value=>{
    viewerSettings[key]=clampValue(key,value);
    range.value=viewerSettings[key];
    num.value=viewerSettings[key];
    repaginateDeferredBySettings=true;
    queueLiveViewerSettings();
  };

  const commit=()=>commitViewerSettings();

  /* 드래그 중에는 전체 페이지 재분할 금지 */
  range.addEventListener('input',()=>live(range.value));
  /* 모바일 Safari/Chrome 모두 손을 뗀 뒤 한 번 확정 */
  range.addEventListener('change',commit);
  range.addEventListener('pointerup',commit);
  range.addEventListener('touchend',commit,{passive:true});

  /* 숫자 입력 중에도 키 입력마다 재분할하지 않는다. */
  num.addEventListener('input',()=>live(num.value));
  num.addEventListener('change',commit);
  num.addEventListener('blur',commit);
  num.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      num.blur();
    }
  });
}

Object.entries(viewerControls).forEach(([key,[rangeSel,numSel]])=>bindViewerPair(key,rangeSel,numSel));

$('#viewerFont').addEventListener('change',()=>{
  viewerSettings.font=$('#viewerFont').value;
  repaginateDeferredBySettings=true;
  applyViewerSettingsVisuals(false);
  saveViewerSettings();
  scheduleRepaginate();
});

$('#toggleViewerSettings').onclick=()=>{
  const panel=$('#viewerSettings');
  const opening=!panel.classList.contains('open');
  panel.classList.toggle('open');

  if(opening){
    /* 패널이 열리며 본문 높이가 달라져도 조작 중에는 재분할하지 않는다. */
    repaginateDeferredBySettings=true;
    clearTimeout(repaginateTimer);
  }else{
    /* 모든 변경을 저장하고, 패널이 닫힌 최종 크기에서 단 한 번 재분할 */
    flushLiveViewerSettings();
    saveViewerSettings();
    requestAnimationFrame(()=>scheduleRepaginate(0));
  }
};

$('#resetViewerSettings').onclick=()=>{
  viewerSettings={...viewerDefaults};
  repaginateDeferredBySettings=true;
  applyViewerSettingsVisuals(true);
  saveViewerSettings();
  scheduleRepaginate();
};

/* ---------------- Markdown ---------------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function inlineMarkdown(text){
  const stash=[];
  text=String(text).replace(/`([^`\n]+)`/g,(_,x)=>{
    stash.push(`<code>${escapeHtml(x)}</code>`);
    return `\u0000${stash.length-1}\u0000`;
  });
  text=escapeHtml(text);
  text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  text=text.replace(/\*\*([^*]+)\*\*/g,'<em>$1</em>');
  text=text.replace(/__([^_]+)__/g,'<em>$1</em>');
  text=text.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  text=text.replace(/(^|[^\*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  text=text.replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
  text=text.replace(/\u0000(\d+)\u0000/g,(_,i)=>stash[Number(i)]);
  return text;
}

function isTableSeparator(line){
  const cells=line.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  return cells.length>0&&cells.every(x=>/^:?-{3,}:?$/.test(x));
}

function renderTable(headerLine,separatorLine,rowLines){
  const heads=headerLine.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  const rows=rowLines.map(line=>line.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));
  let html='<table><thead><tr>';
  heads.forEach(x=>html+=`<th>${inlineMarkdown(x)}</th>`);
  html+='</tr></thead><tbody>';
  rows.forEach(row=>{
    html+='<tr>';
    heads.forEach((_,i)=>html+=`<td>${inlineMarkdown(row[i]||'')}</td>`);
    html+='</tr>';
  });
  html+='</tbody></table>';
  return html;
}

function markdownToBlocks(md){
  md=String(md||'').replace(/\r/g,'');
  const blocks=[];
  const lines=md.split('\n');

  for(let i=0;i<lines.length;){
    const line=lines[i];

    if(!line.trim()){i++;continue}

    if(/^```/.test(line)){
      const lang=line.slice(3).trim();
      const code=[];
      i++;
      while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);
      if(i<lines.length)i++;
      blocks.push(`<pre><code${lang?` data-lang="${escapeHtml(lang)}"`:''}>${escapeHtml(code.join('\n'))}</code></pre>`);
      continue;
    }

    const heading=line.match(/^(#{1,4})\s+(.+)$/);
    if(heading){
      const n=heading[1].length;
      blocks.push(`<h${n} class="md-heading">${inlineMarkdown(heading[2])}</h${n}>`);
      i++;
      continue;
    }

    if(/^([-*_])(?:\s*\1){2,}\s*$/.test(line)){
      blocks.push('<hr>');
      i++;
      continue;
    }

    if(i+1<lines.length&&line.includes('|')&&isTableSeparator(lines[i+1])){
      const rows=[];
      i+=2;
      while(i<lines.length&&lines[i].trim()&&lines[i].includes('|'))rows.push(lines[i++]);
      blocks.push(renderTable(line,lines[i-rows.length-1],rows));
      continue;
    }

    if(/^>\s?/.test(line)){
      const parts=[];
      while(i<lines.length&&/^>\s?/.test(lines[i])){
        parts.push(lines[i++].replace(/^>\s?/,''));
      }
      blocks.push(`<blockquote>${inlineMarkdown(parts.join('\n')).replace(/\n/g,'<br>')}</blockquote>`);
      continue;
    }

    if(/^\s*[-*+]\s+/.test(line)){
      const items=[];
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){
        items.push(`<li>${inlineMarkdown(lines[i++].replace(/^\s*[-*+]\s+/,''))}</li>`);
      }
      blocks.push(`<ul>${items.join('')}</ul>`);
      continue;
    }

    if(/^\s*\d+\.\s+/.test(line)){
      const items=[];
      while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){
        items.push(`<li>${inlineMarkdown(lines[i++].replace(/^\s*\d+\.\s+/,''))}</li>`);
      }
      blocks.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    const para=[line];
    i++;
    while(
      i<lines.length&&
      lines[i].trim()&&
      !/^(#{1,4})\s+/.test(lines[i])&&
      !/^```/.test(lines[i])&&
      !/^>\s?/.test(lines[i])&&
      !/^\s*[-*+]\s+/.test(lines[i])&&
      !/^\s*\d+\.\s+/.test(lines[i])&&
      !(i+1<lines.length&&lines[i].includes('|')&&isTableSeparator(lines[i+1]))
    ){
      para.push(lines[i++]);
    }
    blocks.push(`<p>${inlineMarkdown(para.join('\n')).replace(/\n/g,'<br>')}</p>`);
  }
  return blocks;
}

/* ---------------- 페이지 분할 ---------------- */
let cachedMarkdownSource=null;
let cachedMarkdownBlocks=[];
let cachedOriginalBlocks=[];
let cachedBreakKey='';
let cachedQuoteRoles=new Map();
let cachedBlockStarts=[];
let cachedBlockTexts=[];
let paginationMeasureBox=null;

function htmlToStableText(html){
  const tmp=document.createElement('div');
  tmp.innerHTML=html;
  tmp.querySelectorAll('br').forEach(br=>br.replaceWith(br.hasAttribute('data-reader-break')?'':'\n'));
  return (tmp.textContent||'').replace(/\r/g,'');
}

function getPaginationBlocks(text){
  if(text!==cachedMarkdownSource){
    cachedMarkdownSource=text;
    cachedOriginalBlocks=markdownToBlocks(text);
    cachedBlockTexts=cachedOriginalBlocks.map(htmlToStableText);
    cachedQuoteRoles=readerQuoteRoles(cachedBlockTexts.join('\n'));
    let offset=0;cachedBlockStarts=cachedBlockTexts.map(text=>{const start=offset;offset+=text.length+1;return start;});
    cachedBreakKey='';
  }
  const key=readerBreakKey();
  if(cachedBreakKey!==key){
    cachedBreakKey=key;
    cachedMarkdownBlocks=cachedOriginalBlocks.map((html,index)=>readerApplyBreaks(html,cachedQuoteRoles,cachedBlockStarts[index]));
  }
  return cachedMarkdownBlocks;
}

function ensurePaginationMeasureBox(){
  if(!paginationMeasureBox){
    paginationMeasureBox=document.createElement('div');
    paginationMeasureBox.className='page-inner pagination-measure';
    paginationMeasureBox.setAttribute('aria-hidden','true');
    document.body.appendChild(paginationMeasureBox);
  }

  const rect=pageInnerLeft.getBoundingClientRect();
  const cs=getComputedStyle(pageInnerLeft);
  paginationMeasureBox.style.width=Math.max(1,rect.width)+'px';
  paginationMeasureBox.style.height=Math.max(1,rect.height)+'px';
  paginationMeasureBox.style.fontFamily=cs.fontFamily;
  paginationMeasureBox.style.fontSize=cs.fontSize;
  paginationMeasureBox.style.lineHeight=cs.lineHeight;
  paginationMeasureBox.style.letterSpacing=cs.letterSpacing;
  paginationMeasureBox.style.wordBreak=cs.wordBreak;
  paginationMeasureBox.style.overflowWrap=cs.overflowWrap;
  return paginationMeasureBox;
}

function findPageIndexForAnchor(anchor){
  if(!pageAnchors.length)return 0;
  const target=Math.max(0,Number(anchor)||0);
  let lo=0,hi=pageAnchors.length-1,best=0;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(pageAnchors[mid]<=target){
      best=mid;
      lo=mid+1;
    }else{
      hi=mid-1;
    }
  }
  return best;
}

function splitIntoPages(text){
  const box=ensurePaginationMeasureBox();
  const blocks=getPaginationBlocks(text);
  const blockTexts=cachedBlockTexts;
  const result=[];
  const anchors=[];
  let current=[];
  let currentStartAnchor=0;
  let anchorCursor=0;

  readerStats.splits++;
  const fits=arr=>{
    readerStats.measurements++;
    box.innerHTML=arr.join('');
    return box.scrollHeight<=box.clientHeight+1;
  };

  for(let blockIndex=0;blockIndex<blocks.length;blockIndex++){
    const block=blocks[blockIndex];
    const blockText=blockTexts[blockIndex]||'';
    const blockStartAnchor=anchorCursor;
    /* 블록 사이에 가상의 1문자를 둬, 페이지 구조가 바뀌어도 앵커 순서를 안정적으로 유지 */
    const nextBlockAnchor=blockStartAnchor+blockText.length+1;
    const oversized=readerOversizedParagraph(block,blockText,box);

    if(!oversized&&fits([...current,block])){
      if(!current.length)currentStartAnchor=blockStartAnchor;
      current.push(block);
      anchorCursor=nextBlockAnchor;
      continue;
    }

    if(current.length){
      result.push(current.join(''));
      anchors.push(currentStartAnchor);
      current=[];
    }

    if(!oversized&&fits([block])){
      current=[block];
      currentStartAnchor=blockStartAnchor;
      anchorCursor=nextBlockAnchor;
      continue;
    }

    /*
      한 블록이 한 페이지보다 큰 경우에만 텍스트 단위로 자른다.
      consumed를 함께 기록해서 페이지 번호 대신 실제 본문 위치를 저장할 수 있다.
    */
    const sliceBlock=readerBlockSlicer(block);
    let remaining=blockText;
    let consumed=0;
    let lastBest=512;

    while(remaining){
      let lo=1,hi=Math.min(remaining.length,Math.max(64,Math.ceil(lastBest*1.4))),best=1;
      // Probe near one page, rather than repeatedly laying out half the whole remaining book.
      while(true){
        const candidate=sliceBlock(consumed,consumed+hi);
        if(!fits([candidate]))break;
        best=hi;lo=hi+1;
        if(hi===remaining.length)break;
        hi=Math.min(remaining.length,hi*2);
      }
      while(lo<=hi){
        const mid=(lo+hi)>>1;
        const candidate=sliceBlock(consumed,consumed+mid);
        if(fits([candidate])){
          best=mid;
          lo=mid+1;
        }else{
          hi=mid-1;
        }
      }

      lastBest=best;
      let cut=best;
      const probe=remaining.slice(0,cut);
      const nice=Math.max(
        probe.lastIndexOf('\n'),
        probe.lastIndexOf('. '),
        probe.lastIndexOf('다. '),
        probe.lastIndexOf(' ')
      );
      if(nice>cut*.65)cut=nice+1;
      cut=readerSafeQuoteCut(remaining,cut,cachedQuoteRoles,blockStartAnchor+consumed);

      result.push(sliceBlock(consumed,consumed+cut));
      anchors.push(blockStartAnchor+consumed);
      consumed+=cut;
      remaining=blockText.slice(consumed);
    }

    anchorCursor=nextBlockAnchor;
  }

  if(current.length){
    result.push(current.join(''));
    anchors.push(currentStartAnchor);
  }

  pageAnchors=anchors;
  box.innerHTML='';
  return result.filter(Boolean);
}

function render(){
  if(!pages.length){
    pageInnerLeft.innerHTML='<div class="empty">표시할 내용이 없습니다.</div>';
    pageInnerRight.innerHTML='';
    counter.textContent='0 / 0';
    pageJumpInput.value='';
    pageJumpInput.max='0';
    pageJumpInput.disabled=true;
    $('#pageJumpBtn').disabled=true;
    return;
  }

  readerStats.visibleRenders++;
  pageInnerLeft.innerHTML=pages[pageIndex]||'<div class="empty">표시할 내용이 없습니다.</div>';
  pageInnerRight.innerHTML='';
  counter.textContent=`${pageIndex+1} / ${pages.length}`;
  pageJumpInput.max=String(pages.length);
  pageJumpInput.disabled=false;
  $('#pageJumpBtn').disabled=false;

  /* 화면 전환을 먼저 끝내고 저장은 합쳐서 처리해 페이지 넘김을 막지 않는다. */
  if(!restoreInProgress){
    window.__browserCheckpoint?.();
    scheduleReadingSessionSave(true);
    scheduleActiveRecentPositionSave();
  }
}

async function repaginate(){
  if(!fullText||restoreInProgress||!viewerOverlay.classList.contains('active'))return;
  if(readerState.layout===getLayoutSignature())return;
  const position={pageAnchor:readerAnchor(),pageContext:readerState.context,pageIndex};
  await readerDisplay(position);
}

function goPrevPage(){
  if(restoreInProgress)return;
  if(pageIndex>0){
    pageIndex-=1;
    readerChooseAnchor(pageAnchors[pageIndex]);
    render();
  }
}

function goNextPage(){
  if(restoreInProgress)return;
  if(pageIndex+1<pages.length){
    pageIndex+=1;
    readerChooseAnchor(pageAnchors[pageIndex]);
    render();
  }
}

/* 모바일 본문 탭 이동: 왼쪽 절반=이전, 오른쪽 절반=다음 */
$('#pageSpread').addEventListener('click',e=>{
  if(!pages.length)return;

  /* 링크 등 실제 조작 요소를 누른 경우에는 페이지 이동하지 않음 */
  if(e.target.closest('a,button,input,select,textarea,label'))return;

  /* 텍스트를 선택한 직후의 탭/클릭은 페이지 이동하지 않음 */
  const selection=window.getSelection?.();
  if(selection&&String(selection).trim())return;

  const rect=e.currentTarget.getBoundingClientRect();
  const x=e.clientX-rect.left;
  if(x<rect.width/2)goPrevPage();
  else goNextPage();
});

function jumpToPage(){
  if(restoreInProgress)return;
  if(!pages.length)return;
  const requested=Math.trunc(Number(pageJumpInput.value));
  if(!Number.isFinite(requested)){
    pageJumpInput.focus();
    return;
  }
  const target=Math.min(pages.length,Math.max(1,requested));
  pageJumpInput.value=String(target);
  pageIndex=target-1;
  readerChooseAnchor(pageAnchors[pageIndex]);
  render();
}

$('#pageJumpBtn').onclick=jumpToPage;
pageJumpInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    jumpToPage();
  }
});

/* ---------------- TXT 파일 불러오기 ---------------- */
$('#chooseTxtBtn').onclick=()=>txtFileInput.click();
txtFileInput.addEventListener('change',async()=>{
  const file=txtFileInput.files?.[0];
  if(!file)return;
  if(!/\.txt$/i.test(file.name)){
    setStatus('TXT 파일을 선택해주세요.',true);
    txtFileInput.value='';
    return;
  }
  try{
    const text=await file.text();
    inputText.value=text.replace(/^\uFEFF/,'');
    flushReadingSessionSave(false);
    setStatus(`불러옴: ${file.name}`);
  }catch(error){
    setStatus(error.message||'TXT 파일을 읽지 못했습니다.',true);
  }
});

/* ---------------- 팝업 열기/닫기 ---------------- */
async function openViewer(){
  userEditedAfterRestore=true;
  await readerReady;
  const text=inputText.value;
  if(!text.trim()){setStatus('전자책으로 볼 텍스트를 입력하세요.',true);return;}
  const generation=++readerState.generation;
  setStatus('');viewerOverlay.classList.add('active');readerSetLoading(true);restoreInProgress=true;
  let record=text===fullText&&pages.length?{pageAnchor:readerAnchor(),pageContext:readerState.context}: {pageAnchor:0};
  try{
    record=await upsertRecentText(text,{resetPosition:false});
  }catch(error){activeRecentId='';activeRecentMeta=null;setStatus('최근 내역을 저장하지 못했습니다.',true);}
  if(generation!==readerState.generation)return;
  fullText=text;
  $('#viewerSettings').classList.remove('open');
  await readerDisplay(record,generation);
}

function closeViewer(){
  readerState.cancelled=true;readerState.generation++;
  clearTimeout(repaginateTimer);
  restoreInProgress=false;
  flushActiveRecentPositionSave();
  viewerOverlay.classList.remove('active');readerSetLoading(false);
  $('#viewerSettings').classList.remove('open');
  flushReadingSessionSave(false);
}

async function openRecentBook(id){
  userEditedAfterRestore=true;
  await readerReady;
  const generation=++readerState.generation;
  try{
    const bookRecord=await getRecentBook(id);
    if(generation!==readerState.generation)return;
    if(!bookRecord){setStatus('해당 최근 내역을 찾을 수 없습니다.',true);return;}
    const meta=window.__browserRecentMeta(bookRecord.meta||{id});
    activeRecentId=id;activeRecentMeta=meta;
    inputText.value=bookRecord.text;fullText=bookRecord.text;
    hideRecentHistory();setStatus('');$('#viewerSettings').classList.remove('open');
    viewerOverlay.classList.add('active');
    await readerDisplay(meta,generation);
  }catch(error){if(generation===readerState.generation){restoreInProgress=false;readerSetLoading(false);setStatus(error.message,true);}}
}

$('#recentHistoryBtn').onclick=showRecentHistory;
$('#closeRecentHistory').onclick=hideRecentHistory;
$('#clearRecentHistory').onclick=async()=>{
  if(!confirm('최근 내역 5개를 모두 삭제할까요?'))return;
  try{
    await clearRecentHistory();
    await renderRecentHistory();
  }catch(error){setStatus(error.message||'최근 내역을 삭제하지 못했습니다.',true);}
};
recentOverlay.addEventListener('click',e=>{if(e.target===recentOverlay)hideRecentHistory();});

openViewerBtn.onclick=openViewer;
$('#closeViewer').onclick=closeViewer;
viewerOverlay.addEventListener('click',e=>{
  if(e.target===viewerOverlay)closeViewer();
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&recentOverlay.classList.contains('active')){hideRecentHistory();return;}
  if(e.key==='Escape'&&viewerOverlay.classList.contains('active')){
    closeViewer();
    return;
  }
  if(!viewerOverlay.classList.contains('active'))return;
  const tag=document.activeElement?.tagName;
  const typing=['INPUT','TEXTAREA','SELECT'].includes(tag);
  if(typing)return;
  if(e.key==='ArrowLeft')goPrevPage();
  if(e.key==='ArrowRight')goNextPage();
});

function syncVisualViewport(){
  const vv=window.visualViewport;
  const top=vv?Math.max(0,vv.offsetTop):0;
  const left=vv?Math.max(0,vv.offsetLeft):0;
  const width=vv?vv.width:window.innerWidth;
  const height=vv?vv.height:window.innerHeight;
  const root=document.documentElement;
  root.style.setProperty('--visual-viewport-top',top+'px');
  root.style.setProperty('--visual-viewport-left',left+'px');
  root.style.setProperty('--visual-viewport-width',Math.max(1,width)+'px');
  root.style.setProperty('--visual-viewport-height',Math.max(1,height)+'px');
}

syncVisualViewport();
addEventListener('resize',()=>{
  syncVisualViewport();
  scheduleRepaginate();
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    syncVisualViewport();
    scheduleRepaginate();
  });
  window.visualViewport.addEventListener('scroll',syncVisualViewport);
}


/* 초기화 */

/*
  모바일 브라우저는 첫 프레임 직후 주소창/안전영역 높이가 한 번 더 확정되는 경우가 있다.
  두 프레임만 기다려 최종 측정값으로 첫 페이지 분할을 수행한다.
*/
function nextFrame(){
  return new Promise(resolve=>requestAnimationFrame(()=>resolve()));
}

function waitForViewerLayout(){return readerWaitForLayout();}

function applyReadingRecordToInput(reading){
  if(!reading||typeof reading.text!=='string')return;
  restoredSessionUpdatedAt=Math.max(restoredSessionUpdatedAt,Number(reading.updatedAt)||0);
  inputText.value=reading.text;
}

async function restoreReadingSession(reading){
  if(!reading||typeof reading.text!=='string')return;
  applyReadingRecordToInput(reading);
  await activateRecentFromReading(reading);
  if(reading.isOpen&&reading.text.trim()){
    fullText=reading.text;setStatus('');viewerOverlay.classList.add('active');
    await readerDisplay(reading);
  }else{
    viewerOverlay.classList.remove('active');readerSetLoading(false);
    fullText='';pages=[];pageAnchors=[];pageIndex=0;readerState.logicalAnchor=null;render();
  }
}

const syncReading=loadReadingSessionSync();
if(syncReading){
  applyReadingRecordToInput(syncReading);
  if(syncReading.isOpen){viewerOverlay.classList.add('active');readerSetLoading(true);}
}
(async()=>{
  try{
    const [dbReading,savedFont]=await Promise.all([loadReadingSessionDB(),getSavedFont().catch(()=>null)]);
    let reading=newestReadingRecord([syncReading,dbReading]);
    reading=await readerHydrateReading(reading);
    reading=await window.__browserRecoverReading(reading);
    if(!userEditedAfterRestore&&reading)applyReadingRecordToInput(reading);
    if(savedFont){
      if(viewerSettings.font==='custom'){
        try{
          const oldFingerprint=savedFont.fingerprint;
          await installCustomFont(savedFont,{select:false,repaginateAfter:false});
          if(!oldFingerprint)void saveFontRecord(savedFont);
          setFontUploadStatus(`저장된 글꼴을 불러왔습니다: ${savedFont.name}`);
        }catch(error){viewerSettings.font='serif';saveViewerSettings();setFontUploadStatus(error.message,true);}
      }else{
        // Registration is deferred until initialization finishes, and cannot trigger a reflow.
        void installCustomFont(savedFont,{select:false,repaginateAfter:false}).catch(error=>setFontUploadStatus(error.message,true));
      }
    }else if(viewerSettings.font==='custom'){viewerSettings.font='serif';saveViewerSettings();}
    applyViewerSettings(false);
    readerState.initializing=false;
    if(reading&&!userEditedAfterRestore&&!readerState.cancelled)await restoreReadingSession(reading);
    else readerSetLoading(false);
  }catch(error){readerSetLoading(false);restoreInProgress=false;setStatus(error.message,true);}
  finally{readerState.initializing=false;resolveReaderReady();}
})();
</script>
