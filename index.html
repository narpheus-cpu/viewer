<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전자책 뷰어 - 모바일</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,sans-serif' font-size='34' font-weight='700' fill='%23fff'%3E%EC%B1%85%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff;
  --paper:#fff;
  --ink:#000;
  --muted:#666;
  --soft:#f6f6f6;
  --soft2:#eee;
  --line:#cfcfcf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212;
    --paper:#1c1c1c;
    --ink:#eee;
    --muted:#aaa;
    --soft:#262626;
    --soft2:#2c2c2c;
    --line:#444;
  }
}
:root[data-theme="dark"]{
  --bg:#121212;
  --paper:#1c1c1c;
  --ink:#eee;
  --muted:#aaa;
  --soft:#262626;
  --soft2:#2c2c2c;
  --line:#444;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

/* ---------------- 입력 화면 ---------------- */
.app{
  width:min(640px,100%);
  min-height:100%;
  margin:0 auto;
  padding:32px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.panel{
  width:100%;
  background:var(--paper);
  border:1px solid var(--ink);
  border-radius:8px;
  padding:28px;
}
h1{
  margin:0 0 7px;
  font-size:24px;
  line-height:1.2;
  letter-spacing:-.03em;
}
.sub{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  margin-bottom:20px;
}
label{
  display:block;
  margin:0 0 7px;
  font-size:13px;
  font-weight:800;
}
textarea{
  width:100%;
  min-height:320px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  padding:11px 12px;
  outline:none;
  resize:vertical;
  line-height:1.55;
}
textarea:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
button{
  border:1px solid var(--ink);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  padding:9px 12px;
  font-weight:800;
}
button:hover:not(:disabled){background:var(--soft)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{
  width:100%;
  margin-top:12px;
  background:var(--ink);
  color:var(--paper);
  padding:11px 14px;
}
.primary:hover:not(:disabled){opacity:.85}
.secondary{background:var(--paper);color:var(--ink)}
.status{
  min-height:18px;
  margin-top:9px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}
.status.error{color:var(--ink);font-weight:800}

/* ---------------- 전자책 팝업 ---------------- */
.modal-overlay{
  display:none;
  position:fixed;
  top:var(--visual-viewport-top,0px);
  left:var(--visual-viewport-left,0px);
  width:var(--visual-viewport-width,100vw);
  height:var(--visual-viewport-height,100svh);
  z-index:1000;
  align-items:stretch;
  justify-content:stretch;
  padding:0;
  background:rgba(0,0,0,.55);
}
.modal-overlay.active{display:flex}
.book{
  width:100%;
  min-width:0;
  height:100%;
  min-height:0;
  background:var(--paper);
  border:0;
  border-radius:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  --viewer-font-size:18px;
  --viewer-line-height:1.75;
  --viewer-pad-top:42px;
  --viewer-pad-right:64px;
  --viewer-pad-bottom:42px;
  --viewer-pad-left:64px;
}
.bookhead{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--ink);
}
.booktitle{font-weight:900}
.book-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.book-actions button{padding:7px 10px;font-size:12px}
.book-actions button .button-note{display:block;margin-top:2px;font-size:10px;font-weight:600;line-height:1.25;color:var(--muted)}
.viewer-settings{
  display:none;
  flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:var(--paper);
  padding:12px 14px;
}
.viewer-settings.open{display:block}
.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px 18px;
}
.setting-row{
  display:grid;
  grid-template-columns:108px minmax(90px,1fr) 72px;
  gap:8px;
  align-items:center;
}
.setting-label{margin:0;font-size:12px;font-weight:800}
.setting-row input[type="range"]{padding:0;border:0;box-shadow:none;accent-color:var(--ink)}
.setting-row input[type="number"]{
  padding:6px 7px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  text-align:right;
  font-size:12px;
}
.setting-font{
  display:grid;
  grid-template-columns:108px 1fr;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}
.setting-font select{
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  font-size:12px;
}
.font-upload{
  display:grid;
  grid-template-columns:108px minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
  margin:0 0 10px;
}
.font-upload input[type="file"]{
  min-width:0;
  width:100%;
  padding:6px 7px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  font-size:12px;
}
.font-upload button{padding:7px 10px;font-size:12px}
.font-upload-status{
  grid-column:2 / -1;
  min-height:16px;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}
.settings-footer{display:flex;justify-content:flex-end;margin-top:10px}
.settings-footer button{padding:7px 10px;font-size:12px}
.page-spread{
  flex:1 1 auto;
  min-height:0;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  overflow:hidden;
  background:var(--paper);
}
.page{
  min-width:0;
  min-height:0;
  overflow:hidden;
  position:relative;
  padding:var(--viewer-pad-top) var(--viewer-pad-right) var(--viewer-pad-bottom) var(--viewer-pad-left);
  background:var(--paper);
}
.page + .page{border-left:1px solid var(--line)}
.page-inner{
  height:100%;
  overflow:hidden;
  color:var(--ink);
  font-family:Georgia,"Times New Roman","Noto Serif KR",serif;
  font-size:var(--viewer-font-size);
  line-height:var(--viewer-line-height);
  word-break:break-word;
  overflow-wrap:anywhere;
}
.page-inner h1,.page-inner h2,.page-inner h3,.page-inner h4{display:block!important;width:100%;margin:.2em 0 .7em;line-height:1.3;font-family:inherit;clear:both}
.page-inner h1{font-size:1.65em}
.page-inner h2{font-size:1.4em}
.page-inner h3{font-size:1.18em}
.page-inner p{margin:0 0 1em}
.page-inner ul,.page-inner ol{margin:.2em 0 1em;padding-left:1.6em}
.page-inner li{margin:.25em 0}
.page-inner blockquote{margin:.5em 0 1em;padding:.1em 0 .1em 1em;border-left:4px solid var(--ink);color:var(--muted)}
.page-inner pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:var(--soft);
  border:1px solid var(--line);
  padding:12px 14px;
  border-radius:4px;
  font-family:Consolas,"Courier New",monospace;
  font-size:.82em;
  line-height:1.55;
}
.page-inner code{background:var(--soft2);padding:.12em .3em;border-radius:2px;font-family:Consolas,"Courier New",monospace;font-size:.88em}
.page-inner pre code{background:none;padding:0}
.page-inner a{color:var(--ink);text-decoration:underline}
.page-inner hr{border:0;border-top:1px solid var(--ink);margin:1.2em 0}
.page-inner table{width:100%;border-collapse:collapse;margin:.4em 0 1em;font-family:Arial,"Noto Sans KR",sans-serif;font-size:.82em}
.page-inner th,.page-inner td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;font-family:Arial,"Noto Sans KR",sans-serif}
.controls{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  padding:10px 14px;
  border-top:1px solid var(--ink);
  background:var(--paper);
}
.controls button{min-width:92px;padding:7px 10px;font-size:12px}
.counter{min-width:85px;text-align:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}

@media(max-width:800px){
  .panel{padding:18px}
  .page{--viewer-pad-right:24px;--viewer-pad-left:24px}
}
@media(max-width:560px){
  .setting-row{grid-template-columns:92px minmax(70px,1fr) 66px}
  .setting-font{grid-template-columns:92px 1fr}
  .font-upload{grid-template-columns:92px minmax(0,1fr)}
  .font-upload button{grid-column:2;justify-self:start}
  .book-actions{justify-content:flex-end}
  .page{--viewer-pad-right:16px;--viewer-pad-left:16px}
  .page-inner{font-size:calc(var(--viewer-font-size) * .88)}
}

/* ---------------- 모바일 전용 레이아웃 ---------------- */
.app{width:100%;padding:18px 12px;align-items:flex-start}
.panel{padding:18px 14px;margin-top:max(10px,env(safe-area-inset-top,0px))}
textarea{min-height:42vh}
.input-actions{display:flex;gap:8px;margin-top:10px}
.input-actions button{flex:1}
.hidden-file-input{display:none}
.bookhead{
  padding:calc(7px + env(safe-area-inset-top,0px)) 8px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  flex-wrap:nowrap;
  white-space:nowrap;
  position:relative;
  z-index:5;
  background:var(--paper);
}
.booktitle{font-size:12px;line-height:1;font-weight:900;flex:0 0 auto}
.top-page-nav{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;flex:1 1 auto}
.counter{min-width:42px;text-align:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.page-jump{display:flex;align-items:center;gap:3px;min-width:0}
.page-jump input{width:48px;min-width:0;padding:5px 4px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);text-align:center;font-size:11px;line-height:1.1}
.page-jump button{min-width:0;padding:5px 6px;font-size:10px;line-height:1.1}
.book-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto;flex-wrap:nowrap}
.book-actions button{min-width:0;padding:5px 6px;font-size:10px;line-height:1.1}
.viewer-settings{padding:10px}
.settings-grid{grid-template-columns:1fr;gap:8px}
.setting-row{grid-template-columns:92px minmax(70px,1fr) 62px;gap:6px}
.setting-font{grid-template-columns:92px 1fr}
.font-upload{grid-template-columns:92px minmax(0,1fr)}
.font-upload button{grid-column:2;justify-self:start}
.page-spread{
  grid-template-columns:1fr;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  tap-highlight-color:transparent;
}
.page,.page-inner{-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}
.page-right{display:none}
.page + .page{border-left:0}
.page{--viewer-pad-right:18px;--viewer-pad-left:18px}
.page-inner{font-size:var(--viewer-font-size)}
@media(max-width:360px){
  .bookhead{gap:3px;padding-left:5px;padding-right:5px}
  .booktitle{font-size:11px}
  .counter{min-width:38px;font-size:10px}
  .page-jump{gap:2px}
  .page-jump input{width:42px;padding-left:2px;padding-right:2px;font-size:10px}
  .page-jump button,.book-actions button{padding-left:5px;padding-right:5px;font-size:9px}
  .setting-row{grid-template-columns:82px minmax(60px,1fr) 58px}
}
</style>
</head>
<body>

<div class="app">
  <section class="panel">
    <h1>전자책으로 보기</h1>
    <div class="sub">텍스트를 입력하고 버튼을 누르면, 입력한 내용을 페이지 단위로 넘겨볼 수 있는 전자책 뷰어 팝업이 열립니다.</div>

    <label for="inputText">텍스트 입력</label>
    <textarea id="inputText" placeholder="여기에 텍스트(마크다운 서식 가능)를 입력하거나 붙여넣으세요."></textarea>
    <div class="input-actions">
      <button class="secondary" id="chooseTxtBtn" type="button">TXT 파일 선택</button>
      <input class="hidden-file-input" id="txtFileInput" type="file" accept=".txt,text/plain">
    </div>

    <button class="primary" id="openViewerBtn" type="button">📖 전자책으로 보기</button>
    <div class="status" id="status"></div>
  </section>
</div>

<div class="modal-overlay" id="viewerOverlay">
  <section class="book" id="book">
    <div class="bookhead">
      <div class="booktitle">전자책 보기</div>
      <div class="top-page-nav" aria-label="페이지 이동">
        <div class="counter" id="counter">0 / 0</div>
        <div class="page-jump">
          <input id="pageJumpInput" type="number" min="1" step="1" inputmode="numeric" placeholder="쪽" aria-label="이동할 페이지 번호">
          <button id="pageJumpBtn" type="button">이동</button>
        </div>
      </div>
      <div class="book-actions">
        <button class="secondary" id="toggleViewerSettings" type="button">설정</button>
        <button class="secondary" id="closeViewer" type="button">닫기</button>
      </div>
    </div>

    <div class="viewer-settings" id="viewerSettings">
      <div class="setting-font">
        <span class="setting-label">글꼴</span>
        <select id="viewerFont">
          <option value="serif">명조 / Serif</option>
          <option value="sans">고딕 / Sans-serif</option>
          <option value="mono">고정폭 / Monospace</option>
          <option value="custom" id="customFontOption" disabled>업로드한 글꼴</option>
        </select>
      </div>
      <div class="font-upload">
        <span class="setting-label">글꼴 업로드</span>
        <input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2">
        <button type="button" id="removeCustomFont">저장 글꼴 삭제</button>
        <div class="font-upload-status" id="fontUploadStatus">TTF, OTF, WOFF, WOFF2 파일을 업로드하면 저장 후 적용됩니다.</div>
      </div>

      <div class="settings-grid">
        <div class="setting-row">
          <span class="setting-label">글꼴 크기 (px)</span>
          <input id="fontSizeRange" type="range" min="12" max="36" step="1">
          <input id="fontSizeNumber" type="number" min="12" max="36" step="1">
        </div>
        <div class="setting-row">
          <span class="setting-label">줄간격</span>
          <input id="lineHeightRange" type="range" min="1.1" max="2.6" step="0.05">
          <input id="lineHeightNumber" type="number" min="1.1" max="2.6" step="0.05">
        </div>
        <div class="setting-row">
          <span class="setting-label">위 여백 (px)</span>
          <input id="padTopRange" type="range" min="0" max="160" step="1">
          <input id="padTopNumber" type="number" min="0" max="160" step="1">
        </div>
        <div class="setting-row">
          <span class="setting-label">아래 여백 (px)</span>
          <input id="padBottomRange" type="range" min="0" max="160" step="1">
          <input id="padBottomNumber" type="number" min="0" max="160" step="1">
        </div>
        <div class="setting-row">
          <span class="setting-label">왼쪽 여백 (px)</span>
          <input id="padLeftRange" type="range" min="0" max="180" step="1">
          <input id="padLeftNumber" type="number" min="0" max="180" step="1">
        </div>
        <div class="setting-row">
          <span class="setting-label">오른쪽 여백 (px)</span>
          <input id="padRightRange" type="range" min="0" max="180" step="1">
          <input id="padRightNumber" type="number" min="0" max="180" step="1">
        </div>
      </div>

      <div class="settings-footer">
        <button type="button" id="resetViewerSettings">기본값 복원</button>
      </div>
    </div>

    <div class="page-spread" id="pageSpread">
      <div class="page page-left">
        <div class="page-inner" id="pageInnerLeft">
          <div class="empty">표시할 내용이 없습니다.</div>
        </div>
      </div>
      <div class="page page-right">
        <div class="page-inner" id="pageInnerRight">
          <div class="empty">표시할 내용이 없습니다.</div>
        </div>
      </div>
    </div>

  </section>
</div>

<script>
const $=s=>document.querySelector(s);

const inputText=$('#inputText');
const statusEl=$('#status');
const openViewerBtn=$('#openViewerBtn');
const viewerOverlay=$('#viewerOverlay');
const book=$('#book');
const pageInnerLeft=$('#pageInnerLeft');
const pageInnerRight=$('#pageInnerRight');
const counter=$('#counter');
const pageJumpInput=$('#pageJumpInput');
const txtFileInput=$('#txtFileInput');
const customFontOption=$('#customFontOption');
const fontFile=$('#fontFile');
const fontUploadStatus=$('#fontUploadStatus');

let fullText='';
let pages=[];
let pageIndex=0;
let customFontUrl='';
let customFontStyle=null;
const READING_STORAGE='ebookViewerReadingMobileV1';
const READING_WINDOW_PREFIX='__ebookViewerReadingMobileV1__:';
const READING_DB_NAME='ebookViewerReadingDBV2';
const READING_DB_STORE='sessions';
let restoredSessionUpdatedAt=0;
let userEditedAfterRestore=false;

function setStatus(msg,err=false){
  statusEl.textContent=msg;
  statusEl.classList.toggle('error',!!err);
}

function parseReadingRecord(raw){
  if(!raw)return null;
  try{
    const parsed=typeof raw==='string'?JSON.parse(raw):raw;
    if(!parsed||typeof parsed!=='object'||typeof parsed.text!=='string')return null;
    return {
      text:parsed.text,
      pageIndex:Number.isFinite(Number(parsed.pageIndex))?Number(parsed.pageIndex):0,
      isOpen:!!parsed.isOpen,
      updatedAt:Number.isFinite(Number(parsed.updatedAt))?Number(parsed.updatedAt):0
    };
  }catch(e){
    return null;
  }
}

function newestReadingRecord(records){
  const valid=records.filter(Boolean);
  if(!valid.length)return null;
  return valid.reduce((best,item)=>item.updatedAt>=best.updatedAt?item:best);
}

function loadReadingSessionSync(){
  const records=[];
  try{ records.push(parseReadingRecord(localStorage.getItem(READING_STORAGE))); }catch(e){}
  try{ records.push(parseReadingRecord(sessionStorage.getItem(READING_STORAGE))); }catch(e){}
  try{ records.push(parseReadingRecord(history.state?.ebookViewerReadingMobileV1)); }catch(e){}
  try{
    if(typeof window.name==='string'&&window.name.startsWith(READING_WINDOW_PREFIX)){
      records.push(parseReadingRecord(window.name.slice(READING_WINDOW_PREFIX.length)));
    }
  }catch(e){}
  return newestReadingRecord(records);
}

function openReadingDatabase(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    const request=indexedDB.open(READING_DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(READING_DB_STORE)){
        request.result.createObjectStore(READING_DB_STORE);
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('Reading DB open failed'));
  });
}

async function loadReadingSessionDB(){
  try{
    const db=await openReadingDatabase();
    return await new Promise(resolve=>{
      const request=db.transaction(READING_DB_STORE,'readonly').objectStore(READING_DB_STORE).get('current');
      request.onsuccess=()=>{ const value=parseReadingRecord(request.result); db.close(); resolve(value); };
      request.onerror=()=>{ db.close(); resolve(null); };
    });
  }catch(e){
    return null;
  }
}

async function saveReadingSessionDB(record){
  try{
    const db=await openReadingDatabase();
    await new Promise((resolve,reject)=>{
      const request=db.transaction(READING_DB_STORE,'readwrite').objectStore(READING_DB_STORE).put(record,'current');
      request.onsuccess=()=>resolve();
      request.onerror=()=>reject(request.error||new Error('Reading DB write failed'));
    });
    db.close();
  }catch(e){}
}

function saveReadingSession(isOpen=viewerOverlay.classList.contains('active')){
  const text=isOpen&&fullText!==''?fullText:inputText.value;
  const record={
    text,
    pageIndex,
    isOpen,

  };
  const raw=JSON.stringify(record);
  let savedSomewhere=false;
  try{ localStorage.setItem(READING_STORAGE,raw); savedSomewhere=true; }catch(e){}
  try{ sessionStorage.setItem(READING_STORAGE,raw); savedSomewhere=true; }catch(e){}
  try{
    const state=(history.state&&typeof history.state==='object')?history.state:{};
    history.replaceState({...state,ebookViewerReadingMobileV1:raw},'');
    savedSomewhere=true;
  }catch(e){}
  try{ window.name=READING_WINDOW_PREFIX+raw; savedSomewhere=true; }catch(e){}
  void saveReadingSessionDB(record);
  restoredSessionUpdatedAt=Math.max(restoredSessionUpdatedAt,record.updatedAt);
  return savedSomewhere;
}

/* ---------------- 업로드 글꼴 저장 ---------------- */
const FONT_DB_NAME='ebookViewerFontDBV1';
const FONT_STORE_NAME='fonts';

function setFontUploadStatus(msg,error=false){
  fontUploadStatus.textContent=msg;
  fontUploadStatus.style.color=error?'var(--ink)':'var(--muted)';
}

function openFontDatabase(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('이 브라우저에서는 글꼴 저장을 지원하지 않습니다.'));
      return;
    }
    const request=indexedDB.open(FONT_DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(FONT_STORE_NAME)){
        request.result.createObjectStore(FONT_STORE_NAME);
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('글꼴 저장소를 열 수 없습니다.'));
  });
}

async function getSavedFont(){
  const db=await openFontDatabase();
  return new Promise((resolve,reject)=>{
    const request=db.transaction(FONT_STORE_NAME,'readonly')
      .objectStore(FONT_STORE_NAME).get('current');
    request.onsuccess=()=>{
      db.close();
      resolve(request.result||null);
    };
    request.onerror=()=>{
      db.close();
      reject(request.error||new Error('저장된 글꼴을 읽을 수 없습니다.'));
    };
  });
}

async function saveFontRecord(record){
  const db=await openFontDatabase();
  return new Promise((resolve,reject)=>{
    const request=db.transaction(FONT_STORE_NAME,'readwrite')
      .objectStore(FONT_STORE_NAME).put(record,'current');
    request.onsuccess=()=>{
      db.close();
      resolve();
    };
    request.onerror=()=>{
      db.close();
      reject(request.error||new Error('글꼴을 저장할 수 없습니다.'));
    };
  });
}

async function deleteSavedFont(){
  const db=await openFontDatabase();
  return new Promise((resolve,reject)=>{
    const request=db.transaction(FONT_STORE_NAME,'readwrite')
      .objectStore(FONT_STORE_NAME).delete('current');
    request.onsuccess=()=>{
      db.close();
      resolve();
    };
    request.onerror=()=>{
      db.close();
      reject(request.error||new Error('저장된 글꼴을 삭제할 수 없습니다.'));
    };
  });
}

async function applyCustomFont(record){
  if(customFontUrl)URL.revokeObjectURL(customFontUrl);
  if(customFontStyle)customFontStyle.remove();

  const blob=new Blob([record.data],{type:record.mime||'application/octet-stream'});
  customFontUrl=URL.createObjectURL(blob);
  customFontStyle=document.createElement('style');
  customFontStyle.textContent=`@font-face{font-family:"UploadedViewerFont";src:url("${customFontUrl}");font-display:swap;}`;
  document.head.appendChild(customFontStyle);

  customFontOption.disabled=false;
  customFontOption.textContent=`${record.name} (업로드)`;
  if(document.fonts?.load){
    try{ await document.fonts.load('18px "UploadedViewerFont"'); }catch(e){}
  }
  viewerSettings.font='custom';
  applyViewerSettings(true);
}

function clampValue(key,value){
  const rules={
    fontSize:[12,36],
    lineHeight:[1.1,2.6],
    padTop:[0,160],
    padBottom:[0,160],
    padLeft:[0,180],
    padRight:[0,180]
  };
  const [min,max]=rules[key];
  const n=Number(value);
  return Math.min(max,Math.max(min,Number.isFinite(n)?n:viewerDefaults[key]));
}

function applyViewerSettings(repaginateAfter=true){
  viewerSettings.fontSize=clampValue('fontSize',viewerSettings.fontSize);
  viewerSettings.lineHeight=clampValue('lineHeight',viewerSettings.lineHeight);
  viewerSettings.padTop=clampValue('padTop',viewerSettings.padTop);
  viewerSettings.padBottom=clampValue('padBottom',viewerSettings.padBottom);
  viewerSettings.padLeft=clampValue('padLeft',viewerSettings.padLeft);
  viewerSettings.padRight=clampValue('padRight',viewerSettings.padRight);

  book.style.setProperty('--viewer-font-size',viewerSettings.fontSize+'px');
  book.style.setProperty('--viewer-line-height',viewerSettings.lineHeight);
  book.style.setProperty('--viewer-pad-top',viewerSettings.padTop+'px');
  book.style.setProperty('--viewer-pad-bottom',viewerSettings.padBottom+'px');
  book.style.setProperty('--viewer-pad-left',viewerSettings.padLeft+'px');
  book.style.setProperty('--viewer-pad-right',viewerSettings.padRight+'px');

  const fontMap={
    serif:'Georgia, "Times New Roman", "Noto Serif KR", serif',
    sans:'Arial, "Noto Sans KR", "Malgun Gothic", sans-serif',
    mono:'Consolas, "Courier New", monospace',
    custom:'"UploadedViewerFont", serif'
  };
  if(viewerSettings.font==='custom'&&!customFontUrl)viewerSettings.font='serif';
  const selectedFont=fontMap[viewerSettings.font]||fontMap.serif;
  pageInnerLeft.style.fontFamily=selectedFont;
  pageInnerRight.style.fontFamily=selectedFont;

  $('#viewerFont').value=viewerSettings.font;
  Object.entries(viewerControls).forEach(([key,[rangeSel,numSel]])=>{
    $(rangeSel).value=viewerSettings[key];
    $(numSel).value=viewerSettings[key];
  });

  saveViewerSettings();
  if(repaginateAfter)scheduleRepaginate();
}

function bindViewerPair(key,rangeSel,numSel){
  const range=$(rangeSel),num=$(numSel);
  const handler=value=>{
    viewerSettings[key]=clampValue(key,value);
    range.value=viewerSettings[key];
    num.value=viewerSettings[key];
    applyViewerSettings(true);
  };
  range.addEventListener('input',()=>handler(range.value));
  num.addEventListener('input',()=>handler(num.value));
  num.addEventListener('change',()=>handler(num.value));
}

Object.entries(viewerControls).forEach(([key,[rangeSel,numSel]])=>bindViewerPair(key,rangeSel,numSel));

$('#viewerFont').addEventListener('change',()=>{

/* ---------------- Markdown ---------------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function inlineMarkdown(text){
  const stash=[];
  text=String(text).replace(/`([^`\n]+)`/g,(_,x)=>{
    stash.push(`<code>${escapeHtml(x)}</code>`);
    return `\u0000${stash.length-1}\u0000`;
  });
  text=escapeHtml(text);
  text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  text=text.replace(/\*\*([^*]+)\*\*/g,'<em>$1</em>');
  text=text.replace(/__([^_]+)__/g,'<em>$1</em>');
  text=text.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  text=text.replace(/(^|[^\*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  text=text.replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
  text=text.replace(/\u0000(\d+)\u0000/g,(_,i)=>stash[Number(i)]);
  return text;
}

function isTableSeparator(line){
  const cells=line.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  return cells.length>0&&cells.every(x=>/^:?-{3,}:?$/.test(x));
}

function renderTable(headerLine,separatorLine,rowLines){
  const heads=headerLine.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  const rows=rowLines.map(line=>line.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));
  let html='<table><thead><tr>';
  heads.forEach(x=>html+=`<th>${inlineMarkdown(x)}</th>`);
  html+='</tr></thead><tbody>';
  rows.forEach(row=>{
    html+='<tr>';
    heads.forEach((_,i)=>html+=`<td>${inlineMarkdown(row[i]||'')}</td>`);
    html+='</tr>';
  });
  html+='</tbody></table>';
  return html;
}

function markdownToBlocks(md){
  md=String(md||'').replace(/\r/g,'');
  const blocks=[];
  const lines=md.split('\n');

  for(let i=0;i<lines.length;){
    const line=lines[i];

    if(!line.trim()){i++;continue}

    if(/^```/.test(line)){
      const lang=line.slice(3).trim();
      const code=[];
      i++;
      while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);
      if(i<lines.length)i++;
      blocks.push(`<pre><code${lang?` data-lang="${escapeHtml(lang)}"`:''}>${escapeHtml(code.join('\n'))}</code></pre>`);
      continue;
    }

    const heading=line.match(/^(#{1,4})\s+(.+)$/);
    if(heading){
      const n=heading[1].length;
      blocks.push(`<h${n} class="md-heading">${inlineMarkdown(heading[2])}</h${n}>`);
      i++;
      continue;
    }

    if(/^([-*_])(?:\s*\1){2,}\s*$/.test(line)){
      blocks.push('<hr>');
      i++;
      continue;
    }

    if(i+1<lines.length&&line.includes('|')&&isTableSeparator(lines[i+1])){
      const rows=[];
      i+=2;
      while(i<lines.length&&lines[i].trim()&&lines[i].includes('|'))rows.push(lines[i++]);
      blocks.push(renderTable(line,lines[i-rows.length-1],rows));
      continue;
    }

    if(/^>\s?/.test(line)){
      const parts=[];
      while(i<lines.length&&/^>\s?/.test(lines[i])){
        parts.push(lines[i++].replace(/^>\s?/,''));
      }
      blocks.push(`<blockquote>${inlineMarkdown(parts.join('\n')).replace(/\n/g,'<br>')}</blockquote>`);
      continue;
    }

    if(/^\s*[-*+]\s+/.test(line)){
      const items=[];
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){
        items.push(`<li>${inlineMarkdown(lines[i++].replace(/^\s*[-*+]\s+/,''))}</li>`);
      }
      blocks.push(`<ul>${items.join('')}</ul>`);
      continue;
    }

    if(/^\s*\d+\.\s+/.test(line)){
      const items=[];
      while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){
        items.push(`<li>${inlineMarkdown(lines[i++].replace(/^\s*\d+\.\s+/,''))}</li>`);
      }
      blocks.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    const para=[line];
    i++;
    while(
      i<lines.length&&
      lines[i].trim()&&
      !/^(#{1,4})\s+/.test(lines[i])&&
      !/^```/.test(lines[i])&&
      !/^>\s?/.test(lines[i])&&
      !/^\s*[-*+]\s+/.test(lines[i])&&
      !/^\s*\d+\.\s+/.test(lines[i])&&
      !(i+1<lines.length&&lines[i].includes('|')&&isTableSeparator(lines[i+1]))
    ){
      para.push(lines[i++]);
    }
    blocks.push(`<p>${inlineMarkdown(para.join('\n')).replace(/\n/g,'<br>')}</p>`);
  }
  return blocks;
}

/* ---------------- 페이지 분할 ---------------- */
function splitIntoPages(text){
  const box=pageInnerLeft;
  const blocks=markdownToBlocks(text);
  const result=[];
  let current=[];

  const fits=arr=>{
    box.innerHTML=arr.join('');
    return box.scrollHeight<=box.clientHeight+1;
  };

  for(const block of blocks){
    if(fits([...current,block])){
      current.push(block);
      continue;
    }

    if(current.length){
      result.push(current.join(''));
      current=[];
    }

    if(fits([block])){
      current=[block];
      continue;
    }

    const tmp=document.createElement('div');
    tmp.innerHTML=block;
    let remaining=tmp.textContent||'';

    while(remaining){
      let lo=1,hi=remaining.length,best=1;
      while(lo<=hi){
        const mid=(lo+hi)>>1;
        const candidate=`<p>${inlineMarkdown(remaining.slice(0,mid)).replace(/\n/g,'<br>')}</p>`;
        if(fits([candidate])){
          best=mid;
          lo=mid+1;
        }else{
          hi=mid-1;
        }
      }

      let cut=best;
      const probe=remaining.slice(0,cut);
      const nice=Math.max(
        probe.lastIndexOf('\n'),
        probe.lastIndexOf('. '),
        probe.lastIndexOf('다. '),
        probe.lastIndexOf(' ')
      );
      if(nice>cut*.65)cut=nice+1;

      result.push(`<p>${inlineMarkdown(remaining.slice(0,cut).trim()).replace(/\n/g,'<br>')}</p>`);
      remaining=remaining.slice(cut).trimStart();
    }
  }

  if(current.length)result.push(current.join(''));
  return result.filter(Boolean);
}

function render(){
  if(!pages.length){
    pageInnerLeft.innerHTML='<div class="empty">표시할 내용이 없습니다.</div>';
    pageInnerRight.innerHTML='';
    counter.textContent='0 / 0';
    pageJumpInput.value='';
    pageJumpInput.max='0';
    pageJumpInput.disabled=true;
    $('#pageJumpBtn').disabled=true;
    return;
  }

  pageInnerLeft.innerHTML=pages[pageIndex]||'<div class="empty">표시할 내용이 없습니다.</div>';
  pageInnerRight.innerHTML='';
  counter.textContent=`${pageIndex+1} / ${pages.length}`;
  pageJumpInput.max=String(pages.length);
  pageJumpInput.disabled=false;
  $('#pageJumpBtn').disabled=false;
  saveReadingSession();
}

function repaginate(){
  if(!fullText)return;
  const oldLength=Math.max(pages.length,1);
  const ratio=pageIndex/oldLength;

  pages=splitIntoPages(fullText);
  const approximateIndex=Math.max(0,Math.floor(ratio*Math.max(pages.length,1)));
  pageIndex=Math.min(Math.max(0,pages.length-1),approximateIndex);
  render();
}

function goPrevPage(){
  if(pageIndex>0){
    pageIndex-=1;
    render();
  }
}

function goNextPage(){
  if(pageIndex+1<pages.length){
    pageIndex+=1;
    render();
  }
}

/* 모바일 본문 탭 이동: 왼쪽 절반=이전, 오른쪽 절반=다음 */
$('#pageSpread').addEventListener('click',e=>{
  if(!pages.length)return;

  /* 링크 등 실제 조작 요소를 누른 경우에는 페이지 이동하지 않음 */
  if(e.target.closest('a,button,input,select,textarea,label'))return;

  /* 텍스트를 선택한 직후의 탭/클릭은 페이지 이동하지 않음 */
  const selection=window.getSelection?.();
  if(selection&&String(selection).trim())return;

  const rect=e.currentTarget.getBoundingClientRect();
  const x=e.clientX-rect.left;
  if(x<rect.width/2)goPrevPage();
  else goNextPage();
});

function jumpToPage(){
  if(!pages.length)return;
  const requested=Math.trunc(Number(pageJumpInput.value));
  if(!Number.isFinite(requested)){
    pageJumpInput.focus();
    return;
  }
  const target=Math.min(pages.length,Math.max(1,requested));
  pageJumpInput.value=String(target);
  pageIndex=target-1;
  render();
}

$('#pageJumpBtn').onclick=jumpToPage;
pageJumpInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    jumpToPage();
  }
});

function syncVisualViewport(){
  const vv=window.visualViewport;
  const top=vv?Math.max(0,vv.offsetTop):0;
  const left=vv?Math.max(0,vv.offsetLeft):0;
  const width=vv?vv.width:window.innerWidth;
  const height=vv?vv.height:window.innerHeight;
  const root=document.documentElement;
  root.style.setProperty('--visual-viewport-top',top+'px');
  root.style.setProperty('--visual-viewport-left',left+'px');
  root.style.setProperty('--visual-viewport-width',Math.max(1,width)+'px');
  root.style.setProperty('--visual-viewport-height',Math.max(1,height)+'px');
}

  scheduleRepaginate();
});

  window.visualViewport.addEventListener('resize',()=>{

}


/* 초기화 */
applyViewerSettings(false);
render();

function restoreReadingSession(reading){
  if(!reading||typeof reading.text!=='string')return;
  restoredSessionUpdatedAt=Math.max(restoredSessionUpdatedAt,Number(reading.updatedAt)||0);
  inputText.value=reading.text;
  if(reading.isOpen&&reading.text.trim()){
    fullText=reading.text;
    setStatus('');
    viewerOverlay.classList.add('active');
    syncVisualViewport();
    requestAnimationFrame(()=>{
      pages=splitIntoPages(fullText);
      const savedIndex=Number.isFinite(Number(reading.pageIndex))?Number(reading.pageIndex):0;
      pageIndex=Math.min(
        Math.max(0,pages.length-1),
        Math.max(0,Math.floor(savedIndex))
      );
      render();
    });
  }else{
    viewerOverlay.classList.remove('active');
    fullText='';
    pages=[];
    pageIndex=0;
    render();
  }
}

/* 동기 저장소부터 즉시 복원해서 화면이 비어 보이는 시간을 없앤다. */
const syncReading=loadReadingSessionSync();
if(syncReading)restoreReadingSession(syncReading);

(async()=>{
  /* 영구 저장용 IndexedDB에 더 최신 백업이 있으면 그것을 사용한다. */
  const dbReading=await loadReadingSessionDB();
  if(
    dbReading&&
    !userEditedAfterRestore&&
    (Number(dbReading.updatedAt)||0)>restoredSessionUpdatedAt
  ){
    restoreReadingSession(dbReading);
  }

  try{
    const saved=await getSavedFont();
    if(saved){
      await applyCustomFont(saved);
      setFontUploadStatus(`저장된 글꼴을 불러왔습니다: ${saved.name}`);
    }
  }catch(error){
    setFontUploadStatus(error.message||'저장된 글꼴을 불러오지 못했습니다.',true);
  }
})();
</script>
</body>
</html>
