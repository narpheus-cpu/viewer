plugins { id 'com.android.application' }
android {
    namespace 'com.seosol.ebookviewer.recent'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.seosol.ebookviewer.recent'
        minSdk 23
        targetSdk 36
        versionCode 39
        versionName '1.38'
    }
    buildTypes {
        debug {
            debuggable true
            // Preview signature differs from the private release key: install side by side.
            applicationIdSuffix '.preview138'
            versionNameSuffix '-preview'
        }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
